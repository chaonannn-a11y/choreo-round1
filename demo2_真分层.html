<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChoreoAssist · 真·分层编舞脚手架（AI 分离版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 字体异步加载：先用系统字体秒开，Google Fonts 到了再替换。避免境外字体域名连不上时阻塞整页渲染（曾导致本地也要等~1分钟）。 -->
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap"
      media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap"></noscript>
<!-- SoundTouchJS：保音高变速（time-stretch）。本地引入，离线/手机 LAN 都可用 -->
<script src="vendor/soundtouch.js"></script>
<style>
  :root{
    --bg:#14110f; --bg-panel:#1c1815; --bg-elev:#241f1b; --line:#332c26;
    --ink:#f4ede4; --ink-dim:#a89b8c;
    --coral:#ff5c38; --coral-soft:#ff5c3822; --teal:#5ad1c4; --teal-soft:#5ad1c41f; --amber:#ffb443;
    --pick:#c8ff5a; --pick-soft:#c8ff5a33;   /* 选段高亮：独立于四轨颜色，醒目不刺眼 */
    --spk-w:44px; --spk-gap:8px;             /* 左侧喇叭开关宽+间距；进度条据此左缩，与波形左缘对齐 */
    --track-offset:52px;                     /* = spk-w + spk-gap，波形轨道相对面板左缘的偏移 */
    --radius:14px;
    --mono:'Space Mono',ui-monospace,monospace;
    --sans:'Instrument Sans',system-ui,sans-serif;
    --display:'Bricolage Grotesque',var(--sans);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 600px at 80% -10%, #2a201a 0%, transparent 55%),radial-gradient(900px 500px at -10% 110%, #1d2422 0%, transparent 50%),var(--bg);
    color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:26px clamp(16px,4vw,52px) 60px;
  }
  .wrap{max-width:1480px;margin:0 auto}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:20px}
  .brand h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,4.4vw,42px);letter-spacing:-.02em;line-height:1.02}
  .brand h1 .accent{color:var(--coral)}
  .brand .tag{color:var(--ink-dim);margin-top:6px;font-size:14px}
  .badge{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--amber);border:1px solid #4a3a1e;background:#241b10;padding:5px 10px;border-radius:99px;letter-spacing:.06em;text-transform:uppercase;align-self:center;white-space:nowrap}
  .steps{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
  .step{font-family:var(--sans);font-size:12.5px;color:var(--ink-dim);border:1px solid var(--line);border-radius:99px;padding:5px 13px;display:flex;gap:7px;align-items:center}
  .step .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .steps-note{font-size:12px;color:#6f6357;font-style:italic}
  /* 视图切换器（工作台之外）：分段式两个 tab，明确"我在哪个视图"而非"按了哪个功能键" */
  .view-tabs{display:inline-flex;gap:4px;margin-bottom:12px;background:var(--bg-panel);border:1px solid var(--line);border-radius:12px;padding:4px}
  .view-tab{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink-dim);background:transparent;border:none;border-radius:9px;padding:7px 16px;display:inline-flex;align-items:center;gap:6px;transition:.15s}
  .view-tab:hover:not(:disabled):not(.on){color:var(--ink);background:#241f1b}
  .view-tab.on{color:#1a0d08;background:var(--coral)}
  .view-tab:disabled{opacity:.4;cursor:not-allowed}
  .console{background:linear-gradient(180deg,var(--bg-panel),#181411);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px 20px;box-shadow:0 24px 60px -30px #000, inset 0 1px 0 #ffffff08}
  .transport{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-bottom:14px}
  button{font-family:var(--sans);cursor:pointer;border:none;transition:.15s ease}
  .btn{background:var(--bg-elev);color:var(--ink);border:1px solid var(--line);padding:9px 15px;border-radius:10px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:8px}
  .btn:hover{border-color:#4a4038;background:#2b2521;transform:translateY(-1px)}
  .btn:disabled{opacity:.38;cursor:not-allowed;transform:none}
  .btn.pt{border-color:#5a3226;color:var(--coral)}
  .btn.pt:hover:not(:disabled){background:var(--coral-soft)}
  .btn.pt.on{background:var(--pick);border-color:var(--pick);color:#1a2a00;box-shadow:0 0 0 1px var(--pick) inset}
  .btn.seg{border-color:#2f4a46;color:var(--teal)}
  .btn.seg:hover{background:var(--teal-soft)}
  .play{width:44px;height:44px;border-radius:50%;background:var(--coral);color:#1a0d08;display:grid;place-items:center;flex:none;font-size:17px}
  .play:hover{background:#ff7357;box-shadow:0 8px 22px -8px var(--coral)}
  .play:disabled{background:var(--bg-elev);color:var(--ink-dim);box-shadow:none}
  .time{font-family:var(--mono);font-size:14px;color:var(--ink-dim);white-space:nowrap}
  .time b{color:var(--ink);font-weight:700}
  .file-name{font-size:13px;color:var(--ink-dim);margin-left:auto;font-family:var(--mono);max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 歌曲选择器：占用原文件名位置，右对齐；只有一首时也显示当前曲目 */
  .song-select{margin-left:auto;max-width:46%;font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;text-overflow:ellipsis}
  .song-select:hover{border-color:#4a4038}
  .song-select:focus{outline:none;border-color:var(--amber)}
  .layers{position:relative;min-height:120px;-webkit-user-select:none;-moz-user-select:none;user-select:none;overscroll-behavior-x:contain;touch-action:pan-y}
  /* 贯穿四轨的播放指针：一条长竖线，绝对定位在 layers 容器内、覆盖所有轨道 */
  .global-playhead{position:absolute;top:0;width:2px;background:#fff;box-shadow:0 0 8px #fff9;display:none;z-index:11;pointer-events:none}
  /* 八拍标尺：可选叠加层，覆盖在四轨之上。每拍一条竖线，每8拍第1拍加粗+标 1-8 计数 */
  .beat-overlay{position:absolute;top:0;left:0;display:none;z-index:6;pointer-events:none;-webkit-user-select:none;-moz-user-select:none;user-select:none}
  .beat-overlay.on{display:block}
  .beat-line{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.10)}
  .beat-line.b1{width:1.5px;background:rgba(255,255,255,.28)}   /* 每8拍的第1拍：加粗、更亮 */
  .beat-num{position:absolute;top:2px;font-family:var(--mono);font-size:9px;font-weight:700;color:rgba(255,255,255,.5);transform:translateX(2px)}
  .beat-num.n1{color:var(--amber);font-size:10px}   /* 第1拍数字用琥珀色，一眼看到小节头 */
  /* 放大后的横向平移滑块：拖 thumb 看放大片段的前后内容。左缩 track-offset 与波形轨道对齐 */
  .pan{position:relative;height:12px;margin:10px 0 0 var(--track-offset);border-radius:99px;background:#221d19;display:none;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
  .pan.on{display:block}
  .pan-thumb{position:absolute;top:0;bottom:0;background:var(--amber);opacity:.55;border-radius:99px;min-width:24px;cursor:grab;touch-action:none}
  .pan-thumb:hover{opacity:.8}
  .pan-thumb:active{cursor:grabbing;opacity:.9}
  .pan-thumb:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
  /* 手机端（触摸）滑块加粗，方便手指选中；桌面保持纤细 */
  @media (pointer:coarse){ .pan{height:20px} .seg-h{width:30px} .seg-h-l{left:-15px} .seg-h-r{right:-15px} }
  .loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-dim);font-size:14px;text-align:center;z-index:6}
  /* 加载副提示：只在触屏设备（iPhone/iPad）显示，提醒用户点屏幕解锁 AudioContext；桌面不显示 */
  .loading-tip{display:none;position:absolute;left:0;right:0;bottom:8px;text-align:center;color:var(--amber);font-size:12px;z-index:7;padding:0 12px;pointer-events:none}
  @media (pointer:coarse){ .loading-tip.show{display:block} }
  /* 每行 = 左侧喇叭开关（外部） + 右侧波形轨道 */
  .lane-row{display:flex;align-items:stretch;gap:0}
  .lane-row+.lane-row{margin-top:8px}
  .spk{flex:none;width:var(--spk-w);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:16px;cursor:pointer;border-radius:10px;background:var(--bg-elev);border:1px solid var(--line);margin-right:var(--spk-gap);color:var(--ink-dim);transition:.15s;user-select:none}
  .spk small{font-family:var(--sans);font-size:9.5px;line-height:1}
  .spk:hover{border-color:#4a4038;color:var(--ink)}
  .spk.on{color:var(--sel);border-color:var(--sel);background:var(--sel-soft)}
  .lane{position:relative;flex:1;height:64px;border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid #3a332c;transition:opacity .2s,border-color .15s;background:#0f0c0a}
  .lane:hover{border-color:#4a4038}
  .lane.muted{opacity:.34}
  .lane.sel{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
  .layers.mark-armed .lane{cursor:crosshair;border-color:#56622d}
  .layers.mark-armed .lane:hover{border-color:var(--pick);box-shadow:0 0 0 1px var(--pick)}
  .layers.mark-armed .pt-marker,.layers.mark-armed .pt-flag{opacity:.22;pointer-events:none}
  .layers.draft-focus .lane-row:not(.draft-active){opacity:.28;pointer-events:none}
  .layers.draft-focus .draft-active .pt-marker,.layers.draft-focus .draft-active .pt-flag{opacity:.18;pointer-events:none}
  .layers.draft-focus .spk{pointer-events:none}
  .draft-locked{opacity:.28!important;pointer-events:none!important}
  .lane-canvas{display:block;width:100%;height:100%}
  .lane-ov{position:absolute;inset:0;pointer-events:none;z-index:5}
  .lane-tag{position:absolute;left:10px;top:8px;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.03em;z-index:4;pointer-events:none;background:rgba(20,17,15,.72);padding:3px 8px;border-radius:6px;backdrop-filter:blur(2px)}
  .lane-tag .sub{color:var(--ink-dim);font-weight:400;margin-left:6px;font-size:11px}
  .stack-overlay{position:absolute;inset:0;pointer-events:none;z-index:5}
  /* 打点游标：点波形落下，只为选打点位置，不影响播放 */
  /* 打点预览区间：独立青柠色高亮块 + 左右可拖手柄（醒目、突出"正在选"），限 1~5 秒 */
  .seg-sel{position:absolute;top:0;bottom:0;background:var(--pick-soft);border-left:2px solid var(--pick);border-right:2px solid var(--pick);box-shadow:0 0 14px -2px var(--pick),inset 0 0 20px -6px var(--pick);display:none;z-index:8;pointer-events:none}
  .seg-sel.on{display:block}
  .seg-body{position:absolute;inset:0;cursor:grab;pointer-events:auto;touch-action:none}
  .seg-body:active{cursor:grabbing}
  .seg-h{position:absolute;top:0;bottom:0;width:20px;cursor:ew-resize;z-index:9;touch-action:none;pointer-events:auto}
  .seg-h::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:6px;height:70%;background:var(--pick);border-radius:99px;box-shadow:0 0 8px var(--pick)}
  .seg-h-l{left:-11px}.seg-h-r{right:-11px}
  .seg-flag{position:absolute;top:2px;transform:translateX(2px);font-family:var(--mono);font-size:10px;font-weight:700;color:#1a2a00;background:var(--pick);padding:1px 5px;border-radius:4px;z-index:10;white-space:nowrap;box-shadow:0 0 8px -1px var(--pick)}
  .seg-sel.editing{animation:segpulse .7s ease-in-out 3}
  @keyframes segpulse{0%,100%{box-shadow:0 0 14px -2px var(--pick),inset 0 0 20px -6px var(--pick)}50%{box-shadow:0 0 26px 2px var(--pick),inset 0 0 26px -4px var(--pick)}}
  /* 独立进度条：只控播放位置，不干涉选层。左缩 track-offset 使其左缘与波形轨道左缘对齐。*/
  .progress{position:relative;height:16px;margin:12px 0 16px var(--track-offset);cursor:pointer;display:flex;align-items:center;-webkit-user-select:none;-moz-user-select:none;user-select:none}
  .progress::before{content:'';position:absolute;left:0;right:0;height:5px;background:#2a231e;border-radius:99px;top:50%;transform:translateY(-50%)}
  .progress-fill{position:absolute;left:0;height:5px;background:var(--coral);border-radius:99px;top:50%;transform:translateY(-50%);width:0}
  .progress-knob{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 6px #000a;left:0;transform:translateX(-50%);top:50%;margin-top:-7px}
  .progress:hover .progress-knob{box-shadow:0 0 0 4px var(--coral-soft),0 1px 6px #000a}
  /* 进度条上的"当前放大视窗"高亮框：让用户一眼看到正在放大整段的哪一块 */
  .progress-view{position:absolute;top:50%;transform:translateY(-50%);height:14px;border:1.5px solid var(--amber);background:var(--amber);opacity:0;border-radius:4px;pointer-events:none;transition:opacity .2s;box-shadow:0 0 10px -2px var(--amber)}
  .progress-view.on{opacity:.28}
  .progress-bound{position:absolute;bottom:18px;display:none;transform:translateX(-50%);font-family:var(--mono);font-size:9.5px;color:var(--ink-dim);white-space:nowrap;pointer-events:none}
  .progress-bound.on{display:block}
  .progress-bound.a{transform:none}
  .progress-bound.b{transform:translateX(-100%)}
  .time-ruler{position:relative;height:22px;margin:0 0 5px var(--track-offset);border-bottom:1px solid #2a231e;overflow:hidden}
  .time-tick{position:absolute;bottom:0;width:1px;height:7px;background:#554b42}
  .time-tick-label{position:absolute;bottom:8px;transform:translateX(-50%);font-family:var(--mono);font-size:9.5px;color:var(--ink-dim);white-space:nowrap}
  .project-tools{display:flex;gap:6px;margin-left:auto}
  .structure-head .project-tools+.clear-btn{margin-left:0}
  .import-btn{display:inline-flex;align-items:center;cursor:pointer}
  .import-btn input{display:none}
  .coach-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,18px);display:flex;align-items:center;gap:10px;max-width:min(520px,calc(100vw - 32px));padding:9px 12px;background:#241f1b;border:1px solid var(--line);border-radius:9px;box-shadow:0 14px 36px -16px #000;opacity:0;visibility:hidden;z-index:60;transition:.18s;color:var(--ink);font-size:13px}
  .coach-toast.on{opacity:1;visibility:visible;transform:translate(-50%,0)}
  .coach-toast button{display:none;background:none;border:none;color:var(--coral);font-weight:700;white-space:nowrap}
  .coach-toast.has-action button{display:block}
  .layers.solo-nudge .spk{animation:solo-nudge .7s ease 2}
  @keyframes solo-nudge{50%{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber) inset;transform:translateY(-2px)}}
  /* 待确认灵感的临时编辑栏：位于进度条与四轨之间，不覆盖波形。 */
  .draft-editor{display:none;position:relative;margin:0 0 12px var(--track-offset);padding:10px 12px;border:1px solid #56622d;border-radius:10px;background:#1d2214;box-shadow:0 10px 24px -18px #000;z-index:13}
  .draft-editor.on{display:block}
  .draft-editor::after{content:'';position:absolute;left:clamp(10px,var(--draft-x,50%),calc(100% - 10px));bottom:-7px;width:12px;height:12px;background:#1d2214;border-right:1px solid #56622d;border-bottom:1px solid #56622d;transform:translateX(-50%) rotate(45deg)}
  .draft-editor-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .draft-editor-title{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--pick)}
  .draft-editor-meta{font-family:var(--mono);font-size:11px;color:var(--ink-dim)}
  .draft-editor-row{display:flex;align-items:center;gap:7px}
  .draft-note{flex:1;min-width:120px;background:#14110f;border:1px solid #3a4225;border-radius:8px;color:var(--ink);font-family:var(--sans);font-size:13px;padding:7px 9px}
  .draft-note:focus{outline:none;border-color:var(--pick);box-shadow:0 0 0 1px var(--pick) inset}
  .draft-note::placeholder{color:#6f715a}
  .draft-action{flex:none;border:1px solid #3a4225;border-radius:8px;background:#252b19;color:var(--ink-dim);font-family:var(--sans);font-size:12px;padding:7px 10px;white-space:nowrap}
  .draft-action:hover{border-color:var(--pick);color:var(--ink)}
  .draft-action.on{border-color:var(--pick);color:var(--pick)}
  .draft-action.primary{background:var(--pick);border-color:var(--pick);color:#1a2a00;font-weight:700}
  .draft-help{margin-top:6px;font-size:11px;color:#8e9671}
  /* 循环范围 A/B 端点标记：开启"当前可见范围循环"时，在波形区左右两端显示 A、B，明确循环的就是眼前这段 */
  .loop-edge{position:absolute;top:0;bottom:0;width:0;z-index:10;pointer-events:none;display:none}
  .loop-edge.on{display:block}
  .loop-edge.a{left:0;border-left:2px dashed var(--amber)}
  .loop-edge.b{right:0;border-right:2px dashed var(--amber)}
  .loop-edge .lbl{position:absolute;top:-2px;font-family:var(--mono);font-size:11px;font-weight:700;color:#1a0d08;background:var(--amber);padding:1px 6px;border-radius:0 0 5px 5px;box-shadow:0 2px 6px -1px #000a}
  .loop-edge.a .lbl{left:0;border-radius:0 0 5px 0}
  .loop-edge.b .lbl{right:0;border-radius:0 0 0 5px}
  /* 问号帮助按钮 + 悬停气泡 */
  .help-btn{position:relative;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink-dim);font-family:var(--mono);font-weight:700;font-size:13px;cursor:pointer;align-self:center}
  .help-btn:hover{border-color:var(--amber);color:var(--amber)}
  .help-btn.open{border-color:var(--amber);color:var(--amber)}
  .help-pop{position:absolute;bottom:130%;left:50%;transform:translateX(-50%);width:300px;background:#241f1b;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:var(--sans);font-weight:400;font-size:12.5px;line-height:1.7;color:var(--ink-dim);text-align:left;box-shadow:0 16px 40px -18px #000;opacity:0;visibility:hidden;transition:opacity .15s,visibility 0s .15s;z-index:20}
  .help-pop b{color:var(--ink)}
  /* 只用点击/tap 控制显隐（.open 类是唯一真相源）：桌面手机行为一致，点一下开、再点一下关，不再被 :hover 干扰 */
  .help-btn.open .help-pop{opacity:1;visibility:visible;transition:opacity .15s,visibility 0s}
  .hint-inline{font-size:12px;color:var(--ink-dim);align-self:center;font-style:italic;margin-left:auto}
  /* 灵感点高光段：整块可交互（悬停/点击弹浮层），比只点小旗子好命中很多。lane-ov 是 pointer-events:none，这里单独放开 */
  .pt-marker{position:absolute;top:0;bottom:0;border-left:2px solid;border-right:2px solid;border-color:inherit;border-radius:3px;pointer-events:auto;cursor:pointer;transition:box-shadow .12s ease,background .12s ease}
  .pt-marker:hover{box-shadow:0 0 0 2px #fff9, 0 0 14px -2px #000c}
  .pt-marker.active{box-shadow:0 0 0 2px #fff9 inset,0 0 12px -2px #000c}
  /* 段上直接常驻显示便签文字：边播边能读，不必依赖悬停浮层（修"播放时便签闪烁看不清"）*/
  .pt-label{position:absolute;top:2px;left:3px;right:3px;font-family:var(--sans);font-size:10.5px;line-height:1.25;color:#fff;text-shadow:0 1px 2px #000b,0 0 3px #000a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none;font-weight:600}
  /* 灵感点旗子：段底部的小三角把手，仅作视觉锚点（整段都可点，不再依赖它） */
  .pt-flag{position:absolute;transform:translate(-50%,0);font-family:var(--mono);font-size:10px;font-weight:700;color:#1a0d08;padding:2px 6px;border-radius:4px;bottom:4px;pointer-events:auto;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
  .pt-flag:hover{transform:translate(-50%,-2px) scale(1.12);box-shadow:0 3px 10px -2px #000c}
  .pt-flag.active{transform:translate(-50%,-2px) scale(1.12);box-shadow:0 0 0 2px #fff6}
  @media (pointer:coarse){ .pt-flag{padding:4px 9px;font-size:11px} }
  /* 灵感点浮层：挂在 .layers 上（避开 .lane 的 overflow:hidden），JS 按旗子位置定位 */
  .pt-pop{position:absolute;display:none;width:236px;background:#241f1b;border:1px solid var(--line);border-radius:12px;padding:12px 13px;box-shadow:0 18px 46px -18px #000,0 4px 12px -6px #000;z-index:22;text-align:left}
  .pt-pop::after{content:'';position:absolute;top:100%;left:var(--arrow,50%);transform:translateX(-50%);border:6px solid transparent;border-top-color:#241f1b}
  .pt-pop .pp-meta{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-dim);margin-bottom:5px;letter-spacing:.02em}
  .pt-pop .pp-row{display:flex;gap:7px;flex-wrap:nowrap}
  .pt-pop .pp-row+.pp-row{margin-top:7px}
  .pt-pop .pp-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-family:var(--sans);font-size:12px;color:var(--ink-dim);background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;padding:6px 4px;cursor:pointer;white-space:nowrap;transition:.13s}
  .pt-pop .pp-btn:hover{border-color:#4a4038;color:var(--ink)}
  .pt-pop .pp-btn.on{color:var(--amber);border-color:var(--amber);background:#241b10;box-shadow:0 0 0 1px var(--amber) inset}
  .pt-pop .pp-btn.danger:hover{color:var(--coral);border-color:var(--coral)}
  /* 浮层内文字始终可直接编辑，不再通过“记录/修改”按钮进入第二层状态 */
  .pt-pop .pp-edit{display:block;margin-bottom:11px}
  .pt-pop .pp-input{width:100%;background:#191512;border:1px dashed #3a322b;border-radius:8px;color:var(--ink);font-family:var(--sans);font-size:14px;padding:7px 9px}
  .pt-pop .pp-input:focus{outline:none;border-color:var(--coral);border-style:solid}
  .pt-pop .pp-input::placeholder{color:#5f544a}
  .pt-pop .pp-edit-hint{font-size:10.5px;color:#6f6357;font-style:italic;margin-top:4px}
  .modebar{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-dim)}
  .solo-note{font-family:var(--mono);font-size:11px;color:var(--teal)}
  /* ========== 全曲总览：统一四轨纵向时间地图 ========== */
  .vview{display:none}
  .vview.on{display:block;margin-top:4px}
  .vview-head{font-family:var(--sans);font-size:12.5px;color:var(--ink-dim);margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
  .vview-body{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) 286px;gap:10px;align-items:start}
  .vaxis{position:relative;width:44px}
  .vaxis-tick{position:absolute;right:6px;transform:translateY(-50%);font-family:var(--mono);font-size:10px;color:var(--ink-dim);white-space:nowrap;pointer-events:none}
  .vmap{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;min-width:0}
  .vmap-lane{position:relative;border-radius:8px;background:#0f0c0a;border:1px solid #3a332c;overflow:visible;min-width:0}
  .vmap-head{position:sticky;top:0;height:34px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:700;background:rgba(20,17,15,.94);backdrop-filter:blur(3px);z-index:8;border-bottom:1px solid #2a231e;white-space:nowrap}
  .vmap-point{position:absolute;left:5px;right:5px;min-height:28px;border-radius:6px;border:1.5px solid;box-sizing:border-box;padding:5px 7px 5px 10px;cursor:pointer;overflow:hidden;transition:filter .12s,box-shadow .12s;z-index:2}
  .vmap-point:hover{filter:brightness(1.15);box-shadow:0 4px 14px -7px #000;z-index:5}
  .vmap-point.active{box-shadow:0 0 0 2px #fff inset;z-index:6}
  .vmap-point.passing{box-shadow:0 0 0 2px #fff8,0 0 16px -3px #fff8;filter:brightness(1.12)}
  .vmap-point-text{display:block;font-family:var(--sans);font-size:11.5px;line-height:1.35;color:#fff;text-shadow:0 1px 2px #0009;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vmap-point-text.empty{opacity:.72;font-style:italic}
  /* 卡片保留最小点击高度；左侧细条严格表示真实持续时间，避免短灵感被视觉放大。 */
  .vmap-duration{position:absolute;left:2px;top:0;width:3px;border-radius:3px;pointer-events:none}
  .vmap-empty{position:absolute;left:0;right:0;top:46px;text-align:center;color:#655c53;font-size:12px;font-style:italic;pointer-events:none}
  .vplayhead{position:absolute;height:2px;background:#fff;box-shadow:0 0 8px #fff9;z-index:6;pointer-events:none;display:none}
  .vinspector{position:sticky;top:12px;min-height:150px;border-left:1px solid var(--line);padding:4px 0 4px 14px}
  .vinspector-empty{font-size:12.5px;line-height:1.6;color:var(--ink-dim)}
  .vinspector-title{font-family:var(--display);font-size:15px;font-weight:600;margin-bottom:5px}
  .vinspector-meta{font-family:var(--mono);font-size:11px;color:var(--ink-dim);margin-bottom:10px}
  .vinspector-note{width:100%;min-height:64px;box-sizing:border-box;background:#14110f;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5;padding:8px 9px;resize:vertical}
  .vinspector-note:focus{outline:none;border-color:var(--coral)}
  .vinspector-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .vinspector-btn{background:var(--bg-elev);border:1px solid var(--line);border-radius:7px;color:var(--ink-dim);font-size:11.5px;padding:6px 9px}
  .vinspector-btn:hover{color:var(--ink);border-color:#4a4038}
  .vinspector-btn.on{color:var(--amber);border-color:var(--amber)}
  .vinspector-btn.primary{color:var(--coral);border-color:#5a3226}
  .vinspector-btn.danger:hover{color:var(--coral);border-color:var(--coral)}
  .add-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  /* 缩放控件 */
  /* 带边框的控件组：把"缩放"和"变速"各自框起来 + 加图标，避免两个都显示 ×倍数 时看混 */
  .ctl-group{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:10px;padding:3px 7px;margin-left:4px}
  .ctl-group .ctl-icon{font-size:12px;opacity:.6;line-height:1;user-select:none}
  .ctl-group .ctl-label{font-size:11.5px;color:var(--ink-dim);white-space:nowrap;user-select:none}
  .ctl-group.on{border-color:var(--amber);background:#241b10;box-shadow:0 0 0 1px var(--amber) inset}
  .zoom{display:flex;align-items:center;gap:6px}
  .zoom-btn{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink-dim);font-size:15px;font-weight:700;display:grid;place-items:center;line-height:1}
  .zoom-btn:hover:not(:disabled){border-color:var(--amber);color:var(--amber)}
  .zoom-btn:disabled{opacity:.35;cursor:not-allowed}
  .loop-btn{background:var(--bg-elev);border:1px solid var(--line);color:var(--ink-dim);font-size:12.5px;padding:6px 12px;border-radius:8px;white-space:nowrap;font-family:var(--sans);display:inline-flex;align-items:center;gap:8px}
  .loop-btn .loop-range{padding:0 9px;border-left:1px solid #5f4c2e;border-right:1px solid #5f4c2e;font-family:var(--mono)}
  .loop-btn .loop-state{font-weight:700}
  .loop-btn:hover:not(:disabled){border-color:var(--amber);color:var(--amber)}
  .loop-btn:disabled{opacity:.35;cursor:not-allowed}
  .loop-btn.on{background:#241b10;border-color:var(--amber);color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
  /* 变速下拉：慢放核对/反复听。边框和高亮由外层 .ctl-group 提供，这里只留下拉本体 */
  .rate-select{background:var(--bg-elev);border:1px solid var(--line);color:var(--ink-dim);font-size:12.5px;padding:5px 7px;border-radius:7px;font-family:var(--mono);cursor:pointer}
  .rate-select:hover{border-color:var(--amber);color:var(--amber)}
  .rate-select:focus{outline:none;border-color:var(--amber)}
  .rate-select:disabled{opacity:.35;cursor:not-allowed}
  .zoom-lvl{font-family:var(--mono);font-size:11px;color:var(--ink-dim);min-width:34px;text-align:center}
  .structure{margin-top:26px}
  .structure-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
  .structure-head h2{font-family:var(--display);font-weight:600;font-size:20px}
  .structure-head .sub{color:var(--ink-dim);font-size:13px}
  .structure-head .clear{margin-left:auto}
  .clear-btn{background:none;border:1px solid var(--line);color:var(--ink-dim);font-size:12px;font-family:var(--sans);cursor:pointer;padding:5px 12px;border-radius:8px}
  .clear-btn:hover{border-color:var(--coral);color:var(--coral)}
  .seg-card{background:var(--bg-panel);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .seg-card .seg-title{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
  .seg-card .seg-title .name{font-family:var(--display);font-weight:600;font-size:16px;color:var(--teal)}
  .seg-card .seg-title .range{font-family:var(--mono);font-size:12px;color:var(--ink-dim)}
  .seg-card .no-pt{color:#6f6357;font-size:13px;font-style:italic}
  .pt-item{display:block;padding:8px 10px;border-radius:9px;margin-bottom:6px;background:#191512}
  /* 只读总览行：整行可点跳转 */
  .pt-item.ro{cursor:pointer;transition:filter .13s}
  .pt-item.ro:hover{filter:brightness(1.35)}
  .pt-main{display:flex;align-items:center;gap:12px;min-width:0}
  .pt-note-ro{display:flex;align-items:flex-start;gap:4px;width:100%;margin-top:7px;font-family:var(--sans);font-size:13px;color:var(--ink-dim);line-height:1.45}
  .pt-note-label{flex:none;color:var(--ink-dim);font-weight:600}
  .pt-note-text{min-width:0;color:var(--ink);white-space:normal;overflow-wrap:anywhere}
  /* 只读总览：带标题的字段 位置/长短/文字记录 */
  .pt-field{display:inline-flex;align-items:baseline;flex:none;font-family:var(--sans);font-size:13px;color:var(--ink);line-height:1.4;white-space:nowrap}
  .pt-field b{color:var(--ink-dim);font-weight:600}
  .pt-label-sep{color:var(--ink-dim);font-weight:700;margin-right:4px}
  .pt-value{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
  .pt-num-sep{display:inline-block;margin:0 2px;color:var(--ink);font-weight:700}
  /* 只读总览：最右删除按钮 */
  .pt-del-ro{margin-left:auto;flex:none;background:none;border:1px solid var(--line);color:var(--ink-dim);cursor:pointer;font-size:12px;font-family:var(--sans);padding:4px 10px;border-radius:7px;transition:.13s}
  .pt-del-ro:hover{border-color:var(--coral);color:var(--coral)}
  .pt-item .pt-time{font-family:var(--mono);font-size:12px;color:var(--ink-dim);flex:none;width:50px;cursor:pointer}
  .pt-item .pt-time:hover{color:var(--ink)}
  .layer-badge{font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;flex:none}
  /* 便签：默认是一个带文字的小按钮（醒目、好找），点开才出现输入框（不逼用户写字） */
  /* 便签按钮（第2行整行）：默认虚线小按钮，有内容时用与提示框同款的常规字体/颜色，不再是刺眼琥珀斜体 */
  .note-toggle{order:2;flex-basis:100%;align-self:flex-start;display:inline-flex;align-items:center;gap:5px;min-height:28px;padding:5px 11px;border-radius:8px;border:1px dashed #4a4038;background:var(--bg-elev);color:var(--ink-dim);font-family:var(--sans);font-size:13px;line-height:1.5;cursor:pointer;text-align:left;white-space:normal;max-width:100%}
  .note-toggle:hover{border-color:var(--amber);color:var(--ink)}
  .note-toggle.has{color:var(--ink-dim);border-color:#3a332c;border-style:solid;background:#191512;font-style:normal}
  .pt-note-wrap{order:2;flex-basis:100%;margin-top:8px;display:none}
  .pt-item.note-open .pt-note-wrap{display:block}
  .pt-note-hint{font-size:11px;color:#6f6357;margin-bottom:4px;font-style:italic}
  .pt-note{width:100%;background:transparent;border:none;border-bottom:1px dashed #3a322b;color:var(--ink);font-family:var(--sans);font-size:14px;padding:5px 2px}
  .pt-note:focus{outline:none;border-bottom-color:var(--coral)}
  .pt-note::placeholder{color:#5f544a}
  /* 删除：第1行右侧（order:1，margin-left:auto 推到最右）*/
  .pt-del{order:1;background:none;border:1px solid var(--line);color:var(--ink-dim);cursor:pointer;font-size:11.5px;flex:none;padding:3px 8px;border-radius:7px;margin-left:auto}
  .pt-del:hover{color:var(--coral);border-color:var(--coral)}
  /* 修改片段：第3行（前面的便签按钮 order:2 占满第2行，把它自然挤到新行），保持自然宽度靠左 */
  .pt-edit{order:3;flex:none;align-self:flex-start;background:none;border:1px solid var(--line);color:var(--ink-dim);cursor:pointer;font-size:11.5px;padding:5px 10px;border-radius:7px;margin-top:2px}
  .pt-edit:hover{border-color:var(--amber);color:var(--amber)}
  .cut-note{margin-top:34px;border-top:1px dashed var(--line);padding-top:20px;color:var(--ink-dim);font-size:13px;line-height:1.7}
  .cut-note h3{font-family:var(--display);font-weight:600;color:var(--ink);font-size:15px;margin-bottom:8px}
  .cut-note code{font-family:var(--mono);font-size:12px;color:var(--amber);background:#241b10;padding:2px 6px;border-radius:5px}
  .cut-note .cut{color:#8a7d70}
  .cut-note strong{color:var(--ink)}
  .disclaim{font-family:var(--mono);font-size:11px;color:#6f6357;margin-top:10px}
  /* 通用确认弹窗：用于"取消选中"等易误触且破坏性的操作 */
  .modal-mask{position:fixed;inset:0;background:#0b0908cc;backdrop-filter:blur(3px);display:none;place-items:center;z-index:50}
  .modal-mask.on{display:grid}
  .modal{background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px 18px;width:min(340px,86vw);box-shadow:0 30px 70px -20px #000;text-align:center}
  .modal .m-title{font-family:var(--display);font-weight:600;font-size:17px;color:var(--ink);margin-bottom:6px}
  .modal .m-sub{font-size:13px;color:var(--ink-dim);margin-bottom:18px;line-height:1.6}
  .modal .m-btns{display:flex;gap:10px;justify-content:center}
  .modal .m-btn{flex:1;padding:10px 0;border-radius:10px;font-size:14px;font-weight:600;border:1px solid var(--line);cursor:pointer;transition:.15s}
  /* 危险确认("是，取消")用灰色：不诱导误点；"否，返回"用主色橙：引导用户留在安全侧 */
  .modal .m-yes{background:var(--bg-elev);color:var(--ink-dim);border-color:var(--line)}
  .modal .m-yes:hover{background:#2b2521;color:var(--ink);border-color:#4a4038}
  .modal .m-no{background:var(--coral);color:#1a0d08;border-color:var(--coral)}
  .modal .m-no:hover{background:#ff7357}

  /* ============ 手机端适配（窄屏 ≤480px）============ */
  @media (max-width:480px){
    body{padding:16px 12px 48px}
    .vview-body{grid-template-columns:36px minmax(0,1fr);gap:6px}
    .vinspector{grid-column:1/-1;position:sticky;bottom:6px;top:auto;background:var(--bg-panel);border:1px solid var(--line);border-radius:8px;padding:10px;z-index:12}
    .vmap{gap:4px}
    .vmap-head{font-size:10px}
    .vmap-point{left:3px;right:3px;padding-left:7px}
    .vmap-point-text{font-size:10px}
    .progress-bound{font-size:9px}
    .structure-head{flex-wrap:wrap}
    .project-tools{margin-left:0}
    .draft-editor{margin-left:0}
    .draft-editor-row{flex-wrap:wrap}
    .draft-note{flex:1 1 100%}
    .draft-action{flex:1}
    .pt-item{padding:8px}
    .pt-main{gap:6px}
    .pt-field{font-size:11.5px}
    .pt-num-sep{margin:0 1px}
    .pt-del-ro{padding:4px 7px;font-size:11px}
    .layer-badge{padding:3px 6px;font-size:10px}
    /* 缩放 +/- 和帮助 ? 加大到易点尺寸（≥36px）*/
    .zoom-btn{width:38px;height:34px;font-size:18px}
    .help-btn{width:38px;height:34px;border-radius:10px;font-size:15px}
    /* 帮助气泡在窄屏里限制宽度、避免溢出 */
    .help-pop{width:min(280px,80vw)}
    /* 歌名下拉不挤：占满整行 */
    .song-select{max-width:100%;flex:1 1 100%;margin-left:0}
    /* 标记按钮更大更好点 */
    .btn.pt{padding:11px 16px;font-size:15px}
    /* 进度条手机端加高，圆球加大，方便手指按住拖 */
    .progress{height:26px}
    .progress-knob{width:20px;height:20px;margin-top:-10px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1><span class="accent">Choreo</span>Assist</h1>
      <div class="tag">听清音乐里的每一层，把灵感留在它发生的位置</div>
    </div>
    <div class="badge">Demo · AI 分离版</div>
  </header>

  <!-- 视图切换器：创作视图=局部编辑；全曲总览=完整歌曲时间地图 -->
  <div class="view-tabs" id="viewTabs">
    <button class="view-tab on" id="tabEdit" disabled>✎ 创作视图</button>
    <button class="view-tab" id="tabPreview" disabled>▤ 全曲总览</button>
  </div>

  <div class="console">
    <div class="transport">
      <button class="play" id="playBtn" disabled title="播放/暂停">▶</button>
      <div class="time"><b id="cur">0:00.0</b> / <span id="dur">0:00.0</span></div>
      <div class="ctl-group" id="zoomGroup" title="放大波形：方便把灵感点标得更准">
        <span class="ctl-icon">🔍</span>
        <span class="ctl-label">调整音轨大小</span>
        <div class="zoom" id="zoom">
          <button class="zoom-btn" id="zoomOut" title="缩小" disabled>－</button>
          <span class="zoom-lvl" id="zoomLvl">x4</span>
          <button class="zoom-btn" id="zoomIn" title="放大波形，方便标得更准" disabled>＋</button>
        </div>
      </div>
      <div class="ctl-group" id="rateGroup" title="变速播放：放慢方便反复听、跟练">
        <span class="ctl-icon">⏩</span>
        <span class="ctl-label">倍速</span>
        <select class="rate-select" id="rateSelect" disabled>
          <option value="0.7">x0.7</option>
          <option value="0.8">x0.8</option>
          <option value="0.9">x0.9</option>
          <option value="1" selected>x1.0</option>
          <option value="1.5">x1.5</option>
          <option value="2">x2.0</option>
        </select>
      </div>
      <button class="loop-btn" id="loopBtn" title="放大后可开启：循环播放当前屏幕内可见的时间范围（A→B）" disabled>🔁 当前可见范围（AB）循环：关</button>

          2. 点「标灵感」，再点击或拖动波形选择片段。<br>
          3. 在临时编辑栏试听、移动、调长短并记录文字，最后确认。<br>

        </div>

  </div>

  <div class="structure">
    <div class="structure-head">
      <h2>我的灵感点</h2>
      <div class="project-tools">

        <label class="clear-btn import-btn" title="导入此前导出的项目文件">↑ 导入<input id="importInput" type="file" accept="application/json,.json"></label>

<script>
(function(){
  'use strict';
  const $ = s => document.querySelector(s);
  const LSKEY = 'choreo_demo_stems_v3';   // v3：改为多首歌，灵感点按歌分开存
  // 成品歌单：每首指向一个已用 Demucs 分好四轨的目录。新增歌只需分离后在此加一行。
  const SONGS = [
    { id:'lwymmd',     title:'Look What You Made Me Do', artist:'Taylor Swift', dir:'stems_lwymmd/' },
    { id:'itsme',      title:"It's me",                 artist:'ILLIT',        dir:'stems_itsme/' },
    { id:'mojito',     title:'Mojito',                  artist:'周杰伦',        dir:'stems_mojito/' },
    { id:'hip',        title:'HIP',                     artist:'MAMAMOO',      dir:'stems_hip/' },
    { id:'armageddon', title:'Armageddon',              artist:'aespa',        dir:'stems_armageddon/' },
    { id:'barbie',     title:'Barbie Dreams',           artist:'Nicki Minaj',  dir:'stems_barbie/' },
  ];
  let songId = SONGS[0].id;
  const curSong = () => SONGS.find(s=>s.id===songId) || SONGS[0];
  const STEM_DIR = () => curSong().dir;

  const LAYERS = [
    {id:'vocals', file:'vocals.m4a', name:'人声 / 歌词', sub:'vocals', color:'#ff8fa3', soft:'#ff8fa31f'},
    {id:'drums',  file:'drums.m4a',  name:'鼓 / 节奏',   sub:'drums',  color:'#ffb443', soft:'#ffb44322'},
    {id:'bass',   file:'bass.m4a',   name:'贝斯 / 低音', sub:'bass',   color:'#5ad1c4', soft:'#5ad1c41f'},
    {id:'other',  file:'other.m4a',  name:'旋律 / 其他', sub:'synth·keys', color:'#c9a3ff', soft:'#c9a3ff1f'},
  ];
  const layerOf = id => LAYERS.find(l=>l.id===id);

  let state = { duration:0, activeLayer:'vocals', points:[], mute:{} };
  // points:[{id,t,layerId,note}]；mute:{layerId:true}
  // 视图窗口（缩放）：只影响"看到的时间范围"，不影响播放、不动数据
  let view = { start:0, end:0 };   // 秒；end=0 表示未初始化（=整段）
  let zoom = 4;                    // 创作视图只保留局部尺度；全曲观察交给“全曲总览”
  let followSuspendedByPan = false; // 播放中手动平移后暂时让出自动跟随；下次重新播放时恢复
  let zoomHintTxt = '';            // 缩放提示文案（常驻，renderModebar 时回填）
  let editing = false;             // 是否处于"改片段"态（modebar 给醒目提示）
  let editingNote = '';            // 改片段时暂存原便签，"确认修改"后带回，避免只改长短却丢了记的一句
  let editingOrig = null;          // "编辑长短"时暂存的原灵感点对象；取消时原样恢复，绝不丢点（新建选段时=null）
  let segAdjusted = false;         // 当前预览选段是否被拖动调过长短：true 才在选别处/点空白时弹窗确认；false 静默放行
  let markArmed = false;           // 一次性“标灵感”已开启、正在等待用户点击或拖动轨道
  let pinnedPtId = null;           // 被"点击选中"钉住、浮层常驻可见的已确定灵感点 id（null=无）
  let playSpanHi = null;           // 正在"非循环播放某灵感段"时的段尾秒数：播到此处自动暂停(#5)。null=无此约束
  let suppressClick = false;       // 拖完手柄后抑制紧随的 lane click，防止误重置选段
  let loopView = false;            // 是否开启"循环当前放大视窗"（AB段循环）；只在放大时可用
  let previewMode = false;         // 是否处于纵向全局预览（只读，播放头联动，隐藏横向波形区）
  // 灵感点循环：按段长前置 1/2 秒，结束在灵感本体末尾；同一时刻只有一个点循环，与 loopView 互斥。
  let loopPtId = null;             // 正在循环的灵感点 id，null=无
  const DRAFT_LOOP_ID = '__draft__'; // 待确认草稿循环占用同一播放循环通道，但不写入灵感数据
  let ptLoopLo = 0, ptLoopHi = 0;  // 该点的实际试听/循环边界，已裁剪到 [0,duration]
  let showBeats = false;           // 是否显示八拍标尺（可选叠加层，教学/数拍用，不影响编排）
  let beatData = null;             // 当前歌的拍点数据 {bpm,beats:[t...],nums:[1..8...],measures}
  // 八拍对齐版本（A/B 盲测）：URL ?beat=auto 用自动版，默认 manual（人工锚点版）。用户端只看到"版本"、看不到差别来源。
  const BEAT_VARIANT = (new URLSearchParams(location.search).get('beat')==='auto') ? 'auto' : 'manual';
  // ---- Web Audio 混音引擎：四轨解码进内存，同一 ctx 同一起点播放，天然同步、不卡 ----
  let actx=null;
  let buffers={};        // {id: AudioBuffer}
  let gains={};          // {id: GainNode}
  let sources={};        // {id: AudioBufferSourceNode}（每次播放/ seek 重建）
  let peaks = {};        // {id: Float32Array}
  let playing=false, startCtxTime=0, startOffset=0;   // 用 ctx.currentTime 推算播放进度
  let rate=1;            // 播放速率（0.8/0.9/1/2）。=1 走原生 BufferSource；≠1 走 SoundTouch 保音高变速
  let stFilters={};      // {id: SimpleFilter}  SoundTouch 变速管线（仅 rate≠1 时用）；进度由它的 sourcePosition 反推
  let cursorT=null;   // 打点游标"起点"（秒），null=未落游标；配合 cursorEnd 表示一个 1~5s 的预览片段
  let cursorEnd=null; // 打点游标"终点"（秒）
  const SEG_MIN=1, SEG_MAX=5;   // 高光片段时长限制：1个8拍量级，1~5秒（中速歌≈1个8拍）
  let raf=null, ready=false;

  const els = {
    playBtn:$('#playBtn'), cur:$('#cur'), dur:$('#dur'), songSelect:$('#songSelect'),
    layers:$('#layers'), loading:$('#loading'), loadingTip:$('#loadingTip'),
    modebar:$('#modebar'), ptBtn:$('#ptBtn'),
    structure:$('#structure'), clearBtn:$('#clearBtn'),
    progress:$('#progress'), progressFill:$('#progressFill'), progressKnob:$('#progressKnob'), progressView:$('#progressView'),
    progressA:$('#progressA'), progressB:$('#progressB'), timeRuler:$('#timeRuler'),
    zoomIn:$('#zoomIn'), zoomOut:$('#zoomOut'), zoomLvl:$('#zoomLvl'), zoomGroup:$('#zoomGroup'),
    pan:$('#pan'), panThumb:$('#panThumb'), loopBtn:$('#loopBtn'), beatBtn:$('#beatBtn'), rateSelect:$('#rateSelect'), rateGroup:$('#rateGroup'),
    tabEdit:$('#tabEdit'), tabPreview:$('#tabPreview'), vview:$('#vview'), vviewBody:$('#vviewBody'),
    structureWrap:$('.structure'), addRow:$('.add-row'),
    draftEditor:$('#draftEditor'), draftMeta:$('#draftMeta'), draftNote:$('#draftNote'),
    draftPlayBtn:$('#draftPlayBtn'), draftLoopBtn:$('#draftLoopBtn'), draftCancelBtn:$('#draftCancelBtn'), draftConfirmBtn:$('#draftConfirmBtn'),
    exportBtn:$('#exportBtn'), importInput:$('#importInput'), coachToast:$('#coachToast'), coachText:$('#coachText'), coachAction:$('#coachAction'),
    confirmMask:$('#confirmMask'), confirmTitle:$('#confirmTitle'), confirmSub:$('#confirmSub'), confirmYes:$('#confirmYes'), confirmNo:$('#confirmNo')
  };
  const fmt = s => { if(!isFinite(s)) s=0; const m=Math.floor(s/60); return m+':'+(s%60).toFixed(1).padStart(4,'0'); };
  const fmtWhole = s => { if(!isFinite(s))s=0;const n=Math.max(0,Math.round(s));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0'); };
  // 通用确认弹窗：返回 Promise<boolean>。yes(灰)=确认破坏性操作，no(橙)=返回安全侧
  function askConfirm(title, sub){
    return new Promise(resolve=>{
      els.confirmTitle.textContent=title||'是否确定取消选中';
      els.confirmSub.textContent=sub||'';
      els.confirmMask.classList.add('on');
      const done=(v)=>{ els.confirmMask.classList.remove('on'); els.confirmYes.onclick=null; els.confirmNo.onclick=null; els.confirmMask.onclick=null; document.removeEventListener('keydown',onKey); resolve(v); };
      els.confirmYes.onclick=()=>done(true);
      els.confirmNo.onclick=()=>done(false);
      els.confirmMask.onclick=(e)=>{ if(e.target===els.confirmMask) done(false); };   // 点遮罩空白=否(安全)
      const onKey=(e)=>{ if(e.key==='Escape') done(false); else if(e.key==='Enter') done(true); };
      document.addEventListener('keydown',onKey);
      els.confirmNo.focus();
    });
  }
  // 丢弃当前预览选段。restoreOrig=true 时，若是"编辑长短已有点"，把原点原样加回（不丢）。
  function discardSelection(restoreOrig){
    if(restoreOrig && editing && editingOrig){ state.points.push(editingOrig); }
    cursorT=null; cursorEnd=null; editing=false; editingNote=''; editingOrig=null; segAdjusted=false;
  }
  // 守卫：在"选新段/选别的点/改别的点/点空白"这类会丢掉当前预览选段的动作前调用。
  // 规则：仅当 segAdjusted（拖调过长短）才弹窗确认；否则静默丢弃、直接放行。proceed 是确认后要执行的动作。
  let confirmingCancel=false;
  function guardAdjusted(proceed){
    if(cursorT==null){ proceed(); return; }              // 没有预览选段：无需守卫
    if(!segAdjusted){ discardSelection(true); proceed(); return; }  // 没调过长短：直接取消放行（规则2）
    if(confirmingCancel) return;
    confirmingCancel=true;
    const sub = (editing && editingOrig) ? '当前修改未确认，将恢复到修改前的样子' : '当前选中且已调整的片段未确定，将被丢弃';
    askConfirm('是否放弃当前修改', sub).then(yes=>{
      confirmingCancel=false;
      if(!yes) return;                                   // 否：保留、继续编辑
      discardSelection(true);
      proceed();
    });
  }
  function setMarkArmed(on){
    if(previewMode || cursorT!=null) on=false;
    markArmed=!!on;
    els.layers.classList.toggle('mark-armed',markArmed);
    if(markArmed){forceClosePop();trackEvent('mark_mode_started');}
    refreshPtBtn();
    renderModebar();
  }
  function setDraftFocus(on){
    els.layers.classList.toggle('draft-focus',on);
    els.draftEditor.classList.toggle('on',on);
    const locked=[els.playBtn,els.progress,els.zoomGroup,els.loopBtn,els.beatBtn,els.songSelect,els.tabEdit,els.tabPreview,els.pan,els.structureWrap,els.addRow];
    locked.forEach(el=>{ if(!el)return; el.classList.toggle('draft-locked',on); el.inert=on; });
    if(on){
      markArmed=false;
      els.layers.classList.remove('mark-armed');
      forceClosePop();
      if(playing) pause();
    }
    updateDraftEditor();
  }
  function updateDraftEditor(){
    const on=cursorT!=null && !previewMode && els.layers.classList.contains('draft-focus');
    els.draftEditor.classList.toggle('on',on);
    if(!on) return;
    const L=layerOf(state.activeLayer)||LAYERS[0];
    const dur=Math.max(0,cursorEnd-cursorT);
    els.draftMeta.textContent=L.name+' · '+fmt(cursorT)+'–'+fmt(cursorEnd)+' · '+dur.toFixed(1)+'s';
    els.draftEditor.style.setProperty('--draft-x',Math.max(0,Math.min(100,pct((cursorT+cursorEnd)/2)))+'%');
    if(document.activeElement!==els.draftNote && els.draftNote.value!==editingNote) els.draftNote.value=editingNote||'';
    const auditioning=playing && (loopPtId===DRAFT_LOOP_ID || (playSpanHi!=null && Math.abs(playSpanHi-cursorEnd)<1e-3));
    els.draftPlayBtn.textContent=auditioning?'❚❚ 暂停':'▶ 试听';
    els.draftPlayBtn.classList.toggle('on',auditioning);
    els.draftLoopBtn.textContent=loopPtId===DRAFT_LOOP_ID?'🔁 循环中':'🔁 循环试听';
    els.draftLoopBtn.classList.toggle('on',loopPtId===DRAFT_LOOP_ID);
    els.draftConfirmBtn.textContent=editing?'确认修改':'确认标记';
  }
  function stopDraftPlayback(){
    const wasDraftPlayback=loopPtId===DRAFT_LOOP_ID || (playSpanHi!=null && cursorEnd!=null && Math.abs(playSpanHi-cursorEnd)<1e-3);
    if(loopPtId===DRAFT_LOOP_ID) loopPtId=null;
    if(wasDraftPlayback){
      playSpanHi=null;
      if(playing) pause();
    }
  }
  function beginDraft(layerId,start,end,note){
    state.activeLayer=layerId;
    cursorT=Math.max(0,start);
    cursorEnd=Math.min(state.duration,end);
    editingNote=note||'';
    segAdjusted=false;
    loopPtId=null;
    playSpanHi=null;
    if(loopView) setViewLoop(false);
    setDraftFocus(true);
    buildLanes(); renderMarks(); renderModebar(); renderStructure(); refreshPtBtn(); paintViewBox();
  }
  function cancelDraft(){
    if(cursorT==null) return;
    stopDraftPlayback();
    discardSelection(true);
    setDraftFocus(false);
    save(); buildLanes(); renderMarks(); renderModebar(); renderStructure(); refreshPtBtn(); updateSteps(); tick();
  }
  function confirmDraft(){
    if(cursorT==null) return;
    stopDraftPlayback();
    const wasFirst=!editing&&state.points.length===0;
    const id=(editing && editingOrig)?editingOrig.id:(Date.now()+''+Math.random().toFixed(3).slice(2));
    state.points.push({id,start:cursorT,end:cursorEnd,layerId:state.activeLayer,note:(editingNote||'').trim()});
    cursorT=null; cursorEnd=null; editing=false; editingNote=''; editingOrig=null; segAdjusted=false;
    setDraftFocus(false);
    save(); buildLanes(); renderMarks(); renderModebar(); renderStructure(); refreshPtBtn(); updateSteps(); tick(); guidePointSaved(wasFirst);
  }
  const viewLen = () => (view.end>view.start) ? (view.end-view.start) : state.duration;
  // pct：把某个时刻换算成"当前视窗内"的百分比位置（可能<0或>100，即在窗口外）
  const pct = t => ((t-view.start)/viewLen())*100;
  // 进度条/播放的参照范围：灵感点循环时=该点试听区间；开视窗循环时=当前放大视窗；否则=整首。
  const rangeLo = () => (loopPtId ? ptLoopLo : (loopView ? view.start : 0));
  const rangeHi = () => (loopPtId ? ptLoopHi : (loopView ? view.end : state.duration));
  const rangeLen = () => Math.max(0.01, rangeHi()-rangeLo());
  // 当前播放进度（秒）。用墙钟推算保证显示连续丝滑（rate 倍速流逝）；
  // SoundTouch 的 sourcePosition 是每 4096 帧才跳一次的离散值，只用于 seek/换挡时校准，不用于逐帧显示。
  function now(){
    if(!playing) return startOffset;
    return Math.min(state.duration, startOffset + (actx.currentTime - startCtxTime)*rate);
  }

  // 灵感点/独奏状态按歌分开存：{ [songId]: {activeLayer,points,mute} }
  function readStore(){ try{ return JSON.parse(localStorage.getItem(LSKEY)||'{}')||{}; }catch(e){ return {}; } }
  function save(){ const all=readStore(); all[songId]={activeLayer:state.activeLayer,points:state.points,mute:state.mute}; localStorage.setItem(LSKEY, JSON.stringify(all)); }
  function load(){ const d=readStore()[songId]; if(d){ state.activeLayer=d.activeLayer||'vocals'; state.points=d.points||[]; state.mute=d.mute||{}; } else { state.activeLayer='vocals'; state.points=[]; state.mute={}; } }
  const GUIDE_KEY='choreo_guide_v1', EVENT_KEY='choreo_research_events_v1';
  let guide=(()=>{try{return JSON.parse(localStorage.getItem(GUIDE_KEY)||'{}')||{};}catch(e){return {};}})();
  let coachTimer=null,guidePlayStartedAt=null,guidePlayAccum=0;
  function persistGuide(){localStorage.setItem(GUIDE_KEY,JSON.stringify(guide));}
  function trackEvent(type,data={}){
    let events=[];try{events=JSON.parse(localStorage.getItem(EVENT_KEY)||'[]')||[];}catch(e){}
    events.push({type,at:new Date().toISOString(),songId,...data});
    localStorage.setItem(EVENT_KEY,JSON.stringify(events.slice(-300)));
  }
  function showCoach(text,actionLabel,onAction,duration=6000){
    clearTimeout(coachTimer);els.coachText.textContent=text;els.coachAction.textContent=actionLabel||'';
    els.coachToast.classList.toggle('has-action',!!actionLabel);els.coachToast.classList.add('on');
    els.coachAction.onclick=()=>{els.coachToast.classList.remove('on');if(onAction)onAction();};
    coachTimer=setTimeout(()=>els.coachToast.classList.remove('on'),duration);
  }
  function guideLayerUsed(){
    if(!guide.usedLayer){guide.usedLayer=true;persistGuide();trackEvent('first_layer_solo');}
    if(!guide.markHintShown&&!state.points.length){
      guide.markHintShown=true;persistGuide();
      setTimeout(()=>showCoach('听到有感觉的地方？点一下「标灵感」'),500);
    }
  }
  function guidePlaybackStart(){if(guidePlayStartedAt==null)guidePlayStartedAt=performance.now();}
  function guidePlaybackStop(){if(guidePlayStartedAt!=null){guidePlayAccum+=performance.now()-guidePlayStartedAt;guidePlayStartedAt=null;}}
  function checkPlaybackGuide(){
    if(guide.usedLayer||guide.soloHintShown)return;
    const elapsed=guidePlayAccum+(guidePlayStartedAt==null?0:performance.now()-guidePlayStartedAt);
