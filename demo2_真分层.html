  // ---------- load 4 tracks (decode to buffer + gain 混音图) ----------
  async function init(){
    const AC = window.AudioContext||window.webkitAudioContext;
    actx = new AC();
    // 自动播放策略会把"未经用户手势创建的 AudioContext"置为 suspended，
    // 而 suspended 下 decodeAudioData 在部分浏览器（手机/Safari）会一直不返回 → 卡在"正在载入"。
    // 兜底：监听文档首次手势，自动 resume；解锁后自解绑。
    const unlock=()=>{ if(actx && actx.state==='suspended'){ actx.resume().catch(()=>{}); }
      if(els.loadingTip) els.loadingTip.classList.remove('show');   // 用户已点屏幕解锁，撤下提示
      ['pointerdown','touchstart','keydown','click'].forEach(ev=>document.removeEventListener(ev,unlock)); };
    ['pointerdown','touchstart','keydown','click'].forEach(ev=>document.addEventListener(ev,unlock,{once:false}));
    buildSongSelect();
    await loadSong(songId);
  }
  // 加载/切换一首歌：停播、清空旧 buffer、解码当前歌四轨、重置视窗与缩放
  async function loadSong(id){
    if(!SONGS.some(s=>s.id===id)) id=SONGS[0].id;
    songId=id; els.songSelect.value=id;
    // 停止并清空上一首的音频与状态
    if(playing){ try{stopSources();}catch(e){} }
    playing=false; startOffset=0; if(raf) cancelAnimationFrame(raf);
    buffers={}; peaks={}; gains={}; sources={};
    state.duration=0; zoom=4; loopView=false; loopPtId=null; playSpanHi=null; cursorT=null; cursorEnd=null; editing=false; editingOrig=null; segAdjusted=false; markArmed=false; pinnedPtId=null;
    setDraftFocus(false);
    els.layers.classList.remove('mark-armed');
    if(typeof forceClosePop==='function') forceClosePop();   // 切歌强制收起灵感点浮层（无视钉住）
    beatData=null; showBeats=false; els.beatBtn.classList.remove('on');   // 切歌重置八拍开关
    if(els.beatBtn) els.beatBtn.disabled=true;
    if(previewMode) setPreviewMode(false,false);   // 切歌时先收起旧歌总览，不覆盖新歌的会话偏好
    els.tabEdit.disabled=true; els.tabPreview.disabled=true;
    rate=1; els.rateSelect.value='1'; els.rateGroup.classList.remove('on'); els.rateSelect.disabled=true;   // 切歌复位变速
    fetch('beats/'+BEAT_VARIANT+'/beats_'+id+'.json').then(r=>r.ok?r.json():null).then(d=>{ beatData=d; if(d) els.beatBtn.disabled=false; paintBeats(); }).catch(()=>{ beatData=null; });
    load();                                   // 读这首歌自己的灵感点/独奏
    ready=false;
    els.playBtn.disabled=true; els.zoomIn.disabled=true; els.zoomOut.disabled=true; els.loopBtn.disabled=true; syncLoopButton();
    els.loading.style.display='grid'; els.loading.textContent='正在载入 AI 分离的四条音轨…';
    els.loadingTip.classList.add('show');   // 触屏设备加载时显示"点屏幕解锁"提示（CSS 只在 pointer:coarse 生效）
    els.zoomLvl.textContent='x4';
    const dir=STEM_DIR();
    // 解码兼容封装：老 Safari 的 decodeAudioData 只支持 callback（不返回 Promise），
    // 且 suspended 下可能不返回 → 用 Promise 包一层 + 超时兜底，避免无限卡"正在载入"。
    const decode=(arrbuf)=>new Promise((resolve,reject)=>{
      let done=false;
      const to=setTimeout(()=>{ if(!done){ done=true; reject(new Error('decode timeout')); } }, 20000);
      try{
        const p=actx.decodeAudioData(arrbuf, b=>{ if(!done){done=true;clearTimeout(to);resolve(b);} },
                                              e=>{ if(!done){done=true;clearTimeout(to);reject(e||new Error('decode error'));} });
        if(p&&p.then) p.then(b=>{ if(!done){done=true;clearTimeout(to);resolve(b);} },
                              e=>{ if(!done){done=true;clearTimeout(to);reject(e);} });
      }catch(e){ if(!done){done=true;clearTimeout(to);reject(e);} }
    });
    if(actx.state==='suspended'){ actx.resume().catch(()=>{}); }   // 尝试恢复但不 await：桌面无手势时 resume 会一直 pending，await 会卡住解码。解码在 suspended 下也能正常进行，真正发声在播放时才需要 running。
    let loaded=0, failed=0;
    // 四条并行下载+解码（原来是串行，四条时间相加；并行后总耗时≈最慢那条，弱网下明显更快）
    await Promise.all(LAYERS.map(async L=>{
      try{
        const resp = await fetch(dir+L.file);
        const buf = await decode(await resp.arrayBuffer());
        buffers[L.id]=buf;
        peaks[L.id]=computePeaks(buf,800);
        if(buf.duration>state.duration) state.duration=buf.duration;
        const g=actx.createGain(); g.gain.value = state.mute[L.id]?0:1; g.connect(actx.destination); gains[L.id]=g;
      }catch(e){ failed++; console.warn('decode fail',L.id,e); }
      loaded++; els.loading.textContent=`正在载入 AI 分离的四条音轨… (${loaded}/4)`;
    }));
    if(failed===LAYERS.length){   // 四条全失败：别停在"正在载入"，给出可操作提示
      els.loading.textContent='音频加载失败，请点一下页面再刷新试试（或换 Chrome 打开）';
      return;
    }
    ready=true;
    view=computeTargetView(zoom,0);          // 创作视图默认从歌曲开头进入 x4 局部范围
    els.loading.style.display='none';
    els.loadingTip.classList.remove('show');   // 加载完成，撤下提示
    els.cur.textContent=fmt(0);
    els.dur.textContent=fmt(state.duration);
    els.playBtn.disabled=false;
    els.zoomIn.disabled=false; els.zoomOut.disabled=true;
    els.loopBtn.disabled=false;
    els.rateSelect.disabled=false;   // 载入完成即可变速（任何缩放/播放态都能用）
    els.tabEdit.disabled=false; els.tabPreview.disabled=false;   // 载入完成即可切视图
    els.beatBtn.disabled = !beatData;   // 有拍点数据才可开八拍（异步到达时 fetch 回调里也会再 enable 一次）
    // 进度条归零：切歌后播放位置回到开头，进度条 fill/knob 也要跟着回到最左（否则会停在上一首的位置）
    els.progressFill.style.width='0%'; els.progressKnob.style.left='0%';
    buildLanes(); renderMarks(); renderStructure(); renderModebar(); refreshPtBtn(); updateSteps(); paintViewBox();
    const remembered=sessionStorage.getItem('choreo_view_'+songId);
    setPreviewMode(remembered ? remembered==='overview' : state.points.length>0,false);
  }
  // 歌曲下拉：只有一首也显示当前曲目名；切歌时确认丢弃当前未确认选段
  function buildSongSelect(){
    els.songSelect.innerHTML = SONGS.map(s=>`<option value="${s.id}">${s.title} · ${s.artist}</option>`).join('');
    els.songSelect.value=songId;
    els.songSelect.onchange=()=>{
      const next=els.songSelect.value;
      if(next===songId){ return; }
      loadSong(next);
    };
  }

  function computePeaks(buf,n){
    const ch=buf.getChannelData(0); const block=Math.floor(ch.length/n); const out=new Float32Array(n);
    let gmax=1e-6;
    for(let i=0;i<n;i++){ let mx=0; for(let j=0;j<block;j++){ const v=Math.abs(ch[i*block+j]||0); if(v>mx)mx=v; } out[i]=mx; if(mx>gmax)gmax=mx; }
    for(let i=0;i<n;i++) out[i]=Math.pow(out[i]/gmax,0.8);
    return out;
  }

  // ---------- lanes ----------
  function buildLanes(){
    [...els.layers.querySelectorAll('.lane-row')].forEach(n=>n.remove());
    LAYERS.forEach(L=>{
      const on = !state.mute[L.id];
      const isSolo=on&&LAYERS.every(x=>x.id===L.id||state.mute[x.id]);
      const sel = cursorT!=null && state.activeLayer===L.id;
      const row=document.createElement('div'); row.className='lane-row'+(cursorT!=null&&state.activeLayer===L.id?' draft-active':''); row.dataset.layer=L.id;
      row.style.setProperty('--sel',L.color); row.style.setProperty('--sel-soft',L.soft);
      // 左侧“单听”：一次只听该轨；再次点击同一轨恢复全部音轨。
      const spk=document.createElement('div');spk.className='spk'+(isSolo?' on':'');spk.innerHTML='<span>🎧</span><small>单听</small>';spk.title=isSolo?'恢复全部音轨':'只听'+L.name;
      spk.onclick=(e)=>{e.stopPropagation();isSolo?unmuteAll():soloLayer(L.id);guideLayerUsed();};
      // 右侧波形轨道：默认点击=跳播放；一次性“标灵感”开启后，点击/拖动=创建草稿
      const lane=document.createElement('div'); lane.className='lane'+(on?'':' muted')+(sel?' sel':''); lane.dataset.layer=L.id;
      lane.innerHTML=`<div class="lane-tag" style="color:${L.color}">${L.name}<span class="sub">${L.sub}</span></div>
        <canvas class="lane-canvas"></canvas>
        <div class="lane-ov">
          <div class="seg-sel"><div class="seg-body" title="拖动整体移动"></div><div class="seg-h seg-h-l" data-side="l"></div><div class="seg-h seg-h-r" data-side="r"></div></div>
        </div>`;
      lane.onclick=(ev)=>{
        if(ev.target.closest('.pt-flag')||ev.target.closest('.pt-marker')) return;   // 点在已标记的灵感点上：交给浮层选中逻辑，绝不在它上面落新预览段
        if(ev.target.closest('.seg-h,.seg-body')) return;   // 草稿手柄/主体由各自拖动逻辑处理
        if(suppressClick){ suppressClick=false; return; }    // 刚拖完手柄，抑制这次误触
        if(cursorT!=null) return;                            // 待确认状态只允许操作当前草稿
        const r=lane.getBoundingClientRect(); const p=(ev.clientX-r.left)/r.width;
        const raw=Math.max(0,Math.min(state.duration,view.start+p*viewLen()));
        if(!markArmed){ seek(raw); return; }
        let start=snapBeat(raw), end=beatAfter(start,1);   // 单击默认创建 1 拍
        if(end-start<0.05) end=Math.min(state.duration,start+SEG_MIN);
        if(end>state.duration){end=state.duration;start=Math.max(0,end-SEG_MIN);}
        editing=false; editingOrig=null;
        beginDraft(L.id,start,end,'');
      };
      // 标灵感时按住拖动：直接圈出自定义长度；短位移仍按普通点击处理
      const startRangeDrag=(e)=>{
        if(!markArmed||cursorT!=null||e.target.closest('.seg-h,.seg-body')) return;
        if(e.type==='mousedown'&&e.button!==0) return;
        const r=lane.getBoundingClientRect(), x0=(e.touches?e.touches[0].clientX:e.clientX);
        const raw0=Math.max(0,Math.min(state.duration,view.start+Math.max(0,Math.min(1,(x0-r.left)/r.width))*viewLen()));
        const t0=snapBeat(raw0);
        let moved=false;
        const move=(ev)=>{
          const cx=(ev.touches?ev.touches[0].clientX:ev.clientX);
          if(!moved&&Math.abs(cx-x0)<6) return;
          moved=true;
          if(ev.cancelable) ev.preventDefault();
          const raw=Math.max(0,Math.min(state.duration,view.start+Math.max(0,Math.min(1,(cx-r.left)/r.width))*viewLen()));
          const t1=snapBeat(raw);
          let lo=Math.min(t0,t1), hi=Math.max(t0,t1);
          if(hi-lo<0.05) hi=beatAfter(lo,1);
          if(hi-lo>SEG_MAX){ if(t1>=t0) hi=lo+SEG_MAX; else lo=hi-SEG_MAX; }
          state.activeLayer=L.id; cursorT=Math.max(0,lo); cursorEnd=Math.min(state.duration,hi);
          editing=false; editingOrig=null; editingNote=''; segAdjusted=true;
          renderMarks(); updateDraftEditor();
        };
        const up=()=>{
          document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);
          document.removeEventListener('touchmove',move);document.removeEventListener('touchend',up);
          if(!moved) return;
          suppressClick=true;setTimeout(()=>{suppressClick=false;},260);
          setDraftFocus(true);buildLanes();renderMarks();renderModebar();refreshPtBtn();
        };
        document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
        document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',up);
      };
      lane.addEventListener('mousedown',startRangeDrag);
      lane.addEventListener('touchstart',startRangeDrag,{passive:false});
      // 左右手柄拖动：调整预览片段的起止（限 1~5 秒），鼠标+触摸通用
      lane.querySelectorAll('.seg-h').forEach(h=>{
        const down=(e)=>{
          if(cursorT==null||state.activeLayer!==L.id) return;
          e.preventDefault(); e.stopPropagation();
          if(loopPtId===DRAFT_LOOP_ID) loopPtId=null;
          playSpanHi=null;
          if(playing) pause();
          const side=h.dataset.side, r=lane.getBoundingClientRect();
          const move=(ev)=>{
            if(ev.cancelable) ev.preventDefault();       // 拖动中禁止文本选中/页面滚动，鼠标甩出段外也不丢选中
            const cx=(ev.touches?ev.touches[0].clientX:ev.clientX);
            const p=Math.max(0,Math.min(1,(cx-r.left)/r.width));
            let t=view.start+p*viewLen();
            t=snapBeat(t);                                // 拖动时也吸到最近的拍，段长始终是整数拍
            const minDur=hasBeats()?0.05:SEG_MIN;
            if(side==='l'){ cursorT=Math.max(0,Math.min(t,cursorEnd-minDur)); if(cursorEnd-cursorT>SEG_MAX) cursorT=cursorEnd-SEG_MAX; }
            else { cursorEnd=Math.min(state.duration,Math.max(t,cursorT+minDur)); if(cursorEnd-cursorT>SEG_MAX) cursorEnd=cursorT+SEG_MAX; }
            segAdjusted=true;                            // 拖过手柄=调过长短，之后选别处/点空白要弹窗确认
            renderMarks();updateDraftEditor();
          };
          const up=()=>{ suppressClick=true;setTimeout(()=>{suppressClick=false;},260);document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);document.removeEventListener('touchmove',move);document.removeEventListener('touchend',up); };
          document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
          document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',up);
        };
        h.addEventListener('mousedown',down); h.addEventListener('touchstart',down,{passive:false});
      });
      // 拖草稿主体：整体移动，保持时长；有拍点时起点继续吸附到拍
      const body=lane.querySelector('.seg-body');
      const moveDraft=(e)=>{
        if(cursorT==null||state.activeLayer!==L.id) return;
        e.preventDefault();e.stopPropagation();
        if(loopPtId===DRAFT_LOOP_ID) loopPtId=null;
        playSpanHi=null;
        if(playing) pause();
        const r=lane.getBoundingClientRect(), x0=(e.touches?e.touches[0].clientX:e.clientX);
        const origStart=cursorT, dur=cursorEnd-cursorT;
        const move=(ev)=>{
          if(ev.cancelable) ev.preventDefault();
          const cx=(ev.touches?ev.touches[0].clientX:ev.clientX);
          let next=snapBeat(origStart+(cx-x0)/r.width*viewLen());
          next=Math.max(0,Math.min(state.duration-dur,next));
          cursorT=next;cursorEnd=next+dur;segAdjusted=true;
          renderMarks();updateDraftEditor();
        };
        const up=()=>{suppressClick=true;setTimeout(()=>{suppressClick=false;},260);document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);document.removeEventListener('touchmove',move);document.removeEventListener('touchend',up);};
        document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
        document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',up);
      };
      body.addEventListener('mousedown',moveDraft);body.addEventListener('touchstart',moveDraft,{passive:false});
      row.append(spk,lane); els.layers.appendChild(row);
    });
    // 贯穿四轨的播放指针（一条长竖线，覆盖在所有轨道之上，比每轨各画一条更美观）
    let ph=els.layers.querySelector('#globalPlayhead');
    if(!ph){ ph=document.createElement('div'); ph.id='globalPlayhead'; ph.className='global-playhead'; els.layers.appendChild(ph); }
    // 循环范围 A/B 端点（覆盖在轨道区左右两端；仅"当前可见范围循环"开启时显示）
    let ea=els.layers.querySelector('#loopEdgeA'), eb=els.layers.querySelector('#loopEdgeB');
    if(!ea){ ea=document.createElement('div'); ea.id='loopEdgeA'; ea.className='loop-edge a'; ea.innerHTML='<span class="lbl">A</span>'; els.layers.appendChild(ea); }
    if(!eb){ eb=document.createElement('div'); eb.id='loopEdgeB'; eb.className='loop-edge b'; eb.innerHTML='<span class="lbl">B</span>'; els.layers.appendChild(eb); }
    drawAll(); renderMarks(); paintPlayhead(); paintBeats(); paintLoopEdges();
  }
  // 画循环范围 A/B 端点：贴合轨道区左右边缘，只在 loopView 开时显示
  function paintLoopEdges(){
    const ea=els.layers.querySelector('#loopEdgeA'), eb=els.layers.querySelector('#loopEdgeB');
    if(!ea||!eb) return;
    const lanes=els.layers.querySelectorAll('.lane');
    if(!lanes.length || !loopView){ ea.classList.remove('on'); eb.classList.remove('on'); return; }
    const contRect=els.layers.getBoundingClientRect();
    const first=lanes[0].getBoundingClientRect(), last=lanes[lanes.length-1].getBoundingClientRect();
    const laneLeft=first.left-contRect.left, laneW=first.width, top=first.top-contRect.top, h=last.bottom-first.top;
    ea.style.left=laneLeft+'px'; ea.style.top=top+'px'; ea.style.height=h+'px';
    eb.style.left=(laneLeft+laneW)+'px'; eb.style.top=top+'px'; eb.style.height=h+'px';
    ea.classList.add('on'); eb.classList.add('on');
  }
  function drawAll(){
    // 开启八拍显示时，顶部预留一条净空带给 1-8 数字，波形不画进这条带里，彻底避免数字与波形柱重叠。
    const topPad = showBeats ? 15 : 0;
    els.layers.querySelectorAll('.lane').forEach(lane=>{
      const L=layerOf(lane.dataset.layer), cv=lane.querySelector('.lane-canvas');
      const dpr=window.devicePixelRatio||1, w=lane.clientWidth, h=lane.clientHeight;
      cv.width=w*dpr; cv.height=h*dpr; const c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
      const pk=peaks[L.id]; if(!pk) return;
      const on=!state.mute[L.id];
      const mid=(topPad+h)/2, amp=(h-topPad)*0.44;   // 波形中心线与振幅都下移，为顶部数字带让位
      // 只取视窗 [view.start,view.end] 对应的峰值区间，铺满整宽 = 放大
      const N=pk.length;
      const i0=Math.floor(view.start/state.duration*N), i1=Math.ceil(view.end/state.duration*N);
      const seg=Math.max(1,i1-i0), bw=w/seg;
      c.fillStyle = on ? L.color : '#4a423a80';        // 播放前后不做明暗差，整轨统一色，进度只由贯穿指针体现
      for(let k=0;k<seg;k++){
        const i=i0+k; if(i<0||i>=N) continue;
        const x=k*bw, bh=Math.max(1,pk[i]*amp);
        c.fillRect(x,mid-bh,Math.max(1,bw*0.7),bh*2);
      }
    });
  }
  function hexA(hex,a){const n=parseInt(hex.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}

  // ---------- 拍吸附：选段/拖手柄时把时间吸到最近的拍点（最小单位=1拍），更准更好选 ----------
  // 有拍点数据(beatData.beats)才吸附；没有则回退为"不吸附"(返回原值)，不会卡死。
  function hasBeats(){ return !!(beatData && beatData.beats && beatData.beats.length>1); }
  // 吸到最近的拍点边界
  function snapBeat(t){
    if(!hasBeats()) return t;
    const bs=beatData.beats; let best=bs[0], bd=Math.abs(t-bs[0]);
    for(let i=1;i<bs.length;i++){ const d=Math.abs(t-bs[i]); if(d<bd){bd=d;best=bs[i];} }
    return best;
  }
  // 给定起点，取"往后 n 拍"的拍点时间（n>=1）。用于选段默认铺 1 拍、和保证段长为整数拍。
  function beatAfter(t, n){
    if(!hasBeats()) return Math.min(state.duration, t + SEG_MIN*n);
    const bs=beatData.beats;
    let idx=0, bd=Math.abs(t-bs[0]);
    for(let i=1;i<bs.length;i++){ const d=Math.abs(t-bs[i]); if(d<bd){bd=d;idx=i;} }
    const j=Math.min(bs.length-1, idx+n);
    return bs[j];
  }

  // ---------- solo/mute（真独奏：调各轨 gain）----------
  function applyMute(){ LAYERS.forEach(L=>{ if(gains[L.id]) gains[L.id].gain.value = state.mute[L.id]?0:1; }); }
  function soloLayer(id){ LAYERS.forEach(L=>{ state.mute[L.id]=(L.id!==id); }); applyMute(); buildLanes(); renderModebar(); save(); }
  function unmuteAll(){ state.mute={}; applyMute(); buildLanes(); renderModebar(); save(); }

  function renderModebar(){
    const L=layerOf(state.activeLayer);
    let tip='点击轨道可跳转播放位置；听到有感觉的地方，点「标灵感」';
    if(markArmed) tip='<span style="color:var(--pick);font-weight:700">◆ 正在标灵感 —— 点一下创建 1 拍，按住拖动选择更长片段</span>';
    if(cursorT!=null) tip=`<span style="color:var(--pick);font-weight:700">◆ ${editing?'正在修改':'待确认'}「${L.name}」灵感 —— 拖中间移动，拖两端调整长度</span>`;
    els.modebar.innerHTML=`${tip}
      <button class="btn" id="allBtn" style="padding:5px 11px;font-size:12px;margin-left:6px"${cursorT!=null?' disabled':''}>↺ 恢复全部音轨</button>
      <span class="solo-note" id="zoomHint">${zoomHintTxt||''}</span>`;
    $('#allBtn').onclick=()=>unmuteAll();
  }

  // ---------- marks：把 播放头/高光区间/打点预览 画进每条 lane 的 overlay ----------
  const segStart=p=> (p.start!=null?p.start:p.t);          // 兼容旧的单点 {t}
  const segEnd  =p=> (p.end!=null?p.end:(p.start!=null?p.start:p.t)+SEG_MIN);
  function renderMarks(){
    if(!state.duration) return;
    const overlap=(a,b)=> a<=view.end+1e-6 && b>=view.start-1e-6;   // 区间与视窗有交集就画
    els.layers.querySelectorAll('.lane').forEach(lane=>{
      const ov=lane.querySelector('.lane-ov'); if(!ov) return;
      const laneId=lane.dataset.layer;
      [...ov.querySelectorAll('.pt-marker,.pt-flag')].forEach(n=>n.remove());
      // 高光区间：只画在它自己所属的那条轨、且和视窗有交集
      state.points.filter(p=>p.layerId===laneId && overlap(segStart(p),segEnd(p))).forEach(p=>{
        const PL=layerOf(p.layerId)||LAYERS[0];
        const a=pct(segStart(p)), b=pct(segEnd(p));
        const m=document.createElement('div');m.className='pt-marker'+(loopPtId===p.id?' active':'');
        m.style.left=a+'%'; m.style.width=Math.max(0.6,b-a)+'%';
        m.style.background=hexA(PL.color,.42); m.style.borderColor=PL.color;   // 加深填充，标过的段一眼可见
        m.dataset.id=p.id;                                                     // 整段可 hover/点击触发浮层
        // 段上常驻显示便签文字（有内容才显示）：边播边看清，不闪烁
        if(p.note && p.note.trim()){ const lb=document.createElement('div');lb.className='pt-label';lb.textContent=p.note;m.appendChild(lb); }
        ov.appendChild(m);
        const f=document.createElement('div');f.className='pt-flag'+(loopPtId===p.id?' active':'');f.style.left=a+'%';f.style.background=PL.color;f.textContent=(loopPtId===p.id?'🔁':'◆');f.dataset.id=p.id;ov.appendChild(f);
      });
      // 打点预览区间只画在"选中的那条轨"上
      const seg=ov.querySelector('.seg-sel');
      if(cursorT!=null && laneId===state.activeLayer && overlap(cursorT,cursorEnd)){
        seg.classList.add('on');
        const a=pct(cursorT), b=pct(cursorEnd);
        seg.style.left=a+'%'; seg.style.width=Math.max(0.3,b-a)+'%';   // 严格按真实时长，随缩放同步变化
        let fl=seg.querySelector('.seg-flag'); if(!fl){fl=document.createElement('div');fl.className='seg-flag';seg.appendChild(fl);}
        fl.textContent='◆ '+((cursorEnd-cursorT).toFixed(1))+'s';
      }else if(seg){ seg.classList.remove('on'); }
    });
    updateDraftEditor();
  }

  // ---------- structure：一个按时间排序的灵感点列表（不再分段） ----------
  function renderStructure(){
    if(!state.duration){els.structure.innerHTML='';return;}
    els.structure.innerHTML='';
    if(!state.points.length){
      const e=document.createElement('div');e.className='seg-card';
      e.innerHTML='<div class="no-pt">暂无灵感点 —— 点「标灵感」，再点击或拖动波形选择片段。</div>';
      els.structure.appendChild(e); return;
    }
    const card=document.createElement('div');card.className='seg-card';card.style.borderLeftColor='var(--coral)';
    state.points.slice().sort((a,b)=>segStart(a)-segStart(b)).forEach(p=>card.appendChild(ptRow(p)));
    els.structure.appendChild(card);
  }
  // 下方列表现为「只读总览」：编辑/播放/循环全部收进波形上的灵感点浮层。
  // 这里展示 位置/长短/文字记录（带标题），点击跳到该段开头；最右提供删除（AB测试第一版）。
  function ptRow(p){
    const L=layerOf(p.layerId)||LAYERS[0];
    const s=segStart(p), e=segEnd(p), dur=(e-s).toFixed(1);
    const row=document.createElement('div');row.className='pt-item ro';row.title='点击跳到这段开头（编辑请点波形上的灵感点◆）';
    // 底色区分：整行按所属音轨刷一层淡底色 + 左侧色条，同音轨天然成组
    row.style.background=L.soft;
    row.style.borderLeft='3px solid '+L.color;
    row.onclick=(ev)=>{ if(ev.target.closest('.pt-del-ro')) return; seek(s); };
    const main=document.createElement('div');main.className='pt-main';
    const badge=document.createElement('span');badge.className='layer-badge';badge.style.color='#191512';badge.style.background=L.color;badge.textContent=L.name;
    const clearNum=v=>String(v).replace(/([:.])/g,'<span class="pt-num-sep">$1</span>');
    const pos=document.createElement('span');pos.className='pt-field';pos.innerHTML='<b>位置</b><span class="pt-label-sep">：</span><span class="pt-value">'+clearNum(fmt(s))+'</span>';
    const len=document.createElement('span');len.className='pt-field';len.innerHTML='<b>长短</b><span class="pt-label-sep">：</span><span class="pt-value">'+clearNum(dur)+'s</span>';
    // 删除按钮（最右）：AB测试第一版——列表内直接删
    const del=document.createElement('button');del.className='pt-del-ro';del.textContent='🗑 删除';del.title='删除这个灵感点';
    del.onclick=(ev)=>{ ev.stopPropagation();
      if(loopPtId===p.id) loopPtId=null;
      if(pinnedPtId===p.id) forceClosePop();
      state.points=state.points.filter(x=>x.id!==p.id);
      save();renderStructure();renderMarks();updateSteps();tick();
    };
    main.append(badge,pos,len,del);
    row.append(main);
    if(p.note && p.note.trim()){
      const nt=document.createElement('div');nt.className='pt-note-ro';
      const noteLabel=document.createElement('span');noteLabel.className='pt-note-label';noteLabel.textContent='文字记录：';
      const noteText=document.createElement('span');noteText.className='pt-note-text';noteText.textContent=p.note;
      nt.append(noteLabel,noteText);row.append(nt);
    }
    return row;
  }

  // ---------- 一次性“标灵感”入口：确认与取消均在临时编辑栏完成 ----------
  function refreshPtBtn(){
    els.ptBtn.disabled=!ready||previewMode||cursorT!=null;
    els.ptBtn.classList.toggle('on',markArmed);
    els.ptBtn.textContent=markArmed?'✕ 退出标记':'◆ 标灵感';
    updateDraftEditor();
  }
  els.ptBtn.onclick=()=>{ if(!ready||previewMode||cursorT!=null)return; setMarkArmed(!markArmed); };
  els.draftNote.addEventListener('input',()=>{ editingNote=els.draftNote.value; });
  els.draftNote.addEventListener('keydown',(e)=>{
    if(e.key==='Enter'){ e.preventDefault(); confirmDraft(); }
    else if(e.key==='Escape'){ e.preventDefault(); cancelDraft(); }
  });
  els.draftConfirmBtn.onclick=confirmDraft;
  els.draftCancelBtn.onclick=cancelDraft;

  // ---------- 灵感点浮层：电脑 hover / 手机 tap，文字可直接修改，集成播放/循环/编辑长短/删除 ----------
  const isTouch = window.matchMedia('(hover:none)').matches || ('ontouchstart' in window);
  let popPtId = null;              // 当前浮层对应的灵感点 id（null=未打开）
  let popHideTimer = null;         // 电脑端移开后的延迟收起计时器（给"从旗子移到浮层"留缓冲）

  // 浮层 DOM（挂在 body，用 fixed 定位到旗子上方；避开 .lane 的 overflow:hidden 与滚动裁剪）
  const pop=document.createElement('div'); pop.className='pt-pop'; pop.style.position='fixed';
  pop.innerHTML=`<div class="pp-meta"></div>
    <div class="pp-edit"><input class="pp-input" type="text" placeholder="直接记录这处灵感"><div class="pp-edit-hint">失焦或回车自动保存 · Esc 撤销本次文字修改</div></div>
    <div class="pp-row">
      <button class="pp-btn" data-act="play">▶ 播放</button>
      <button class="pp-btn" data-act="loop">🔁 循环</button>
    </div>
    <div class="pp-row">
      <button class="pp-btn" data-act="len">↕ 编辑长短</button>
      <button class="pp-btn danger" data-act="del">🗑 删除</button>
    </div>`;
  document.body.appendChild(pop);
  const ppMeta=pop.querySelector('.pp-meta'), ppInput=pop.querySelector('.pp-input'),
        ppPlay=pop.querySelector('[data-act="play"]'), ppLoop=pop.querySelector('[data-act="loop"]'),
        ppLen=pop.querySelector('[data-act="len"]'), ppDel=pop.querySelector('[data-act="del"]');
  let popNoteBeforeEdit='';

  const findPt = id => state.points.find(x=>x.id===id);
  // 灵感段的播放/循环区间（#3 新时长规则）：
  //   起点 = 段首 - 过渡（段长≤2s 过渡+1s，>2s 过渡+2s）；终点 = 段尾本身（不再+2s）。裁剪到 [0,duration]。
  function ptSpan(p){
    const s=segStart(p), e=segEnd(p);
    const lead = (e-s)<=2 ? 1 : 2;
    return [Math.max(0, s-lead), Math.min(state.duration, e)];
  }

  function fillPop(p){
    const L=layerOf(p.layerId)||LAYERS[0];
    const s=segStart(p), e=segEnd(p);
    ppMeta.textContent = L.name.split(' ')[0]+'层 · '+fmt(s)+'-'+fmt(e);   // 如「鼓层 · 0:46.0-0:47.0」
    ppLoop.classList.toggle('on', loopPtId===p.id);
    ppLoop.textContent = loopPtId===p.id ? '🔁 循环中' : '🔁 循环';
    // #4：正在播这一段时，播放键显示为"暂停"
    const playingThis = playing && (loopPtId===p.id || (playSpanHi!=null && Math.abs(playSpanHi-segEnd(p))<1e-3));
    ppPlay.textContent = playingThis ? '❚❚ 暂停' : '▶ 播放';
    ppPlay.classList.toggle('on', playingThis);
    if(document.activeElement!==ppInput) ppInput.value=p.note||'';
  }
  // 把浮层定位到某个旗子上方（fixed 坐标）
  function placePop(flag){
    const r=flag.getBoundingClientRect();
    pop.style.visibility='hidden'; pop.style.display='block';
    const pw=pop.offsetWidth, ph=pop.offsetHeight;
    let left=r.left + r.width/2 - pw/2;
    left=Math.max(8, Math.min(window.innerWidth-pw-8, left));   // 不超出视口左右
    let top=r.top - ph - 10;
    if(top<8) top=r.bottom+10;                                   // 上方放不下就翻到下方
    pop.style.left=left+'px'; pop.style.top=top+'px';
    // 箭头对准旗子中心
    const arrow=(r.left+r.width/2)-left; pop.style.setProperty('--arrow', Math.max(14,Math.min(pw-14,arrow))+'px');
    pop.style.visibility='visible';
  }
  function markActiveFlags(){
    const hi = id => id && (id===popPtId || id===pinnedPtId || id===loopPtId);
    els.layers.querySelectorAll('.pt-flag').forEach(f=>f.classList.toggle('active', hi(f.dataset.id)));
    els.layers.querySelectorAll('.pt-marker').forEach(m=>m.classList.toggle('active', hi(m.dataset.id)));
  }
  function openPop(id, flag){
    const p=findPt(id); if(!p) return;
    clearTimeout(popHideTimer);
    popPtId=id; fillPop(p); placePop(flag);
    markActiveFlags();
  }
  function closePop(){
    if(pinnedPtId) return;                       // 钉住态：不因鼠标移开而收起（改动1：便签常驻可见）
    popPtId=null; pop.style.display='none'; pop.classList.remove('editing');
    markActiveFlags();
  }
  // 强制收起（切歌/落新段/删除等场景），无视钉住
  function forceClosePop(){ pinnedPtId=null; popPtId=null; pop.style.display='none'; pop.classList.remove('editing'); markActiveFlags(); }

  // 播放/暂停某灵感段：≤2s 前置 1s，>2s 前置 2s，播到灵感本体末尾自动停。
  function playPtSpan(p){
    const [lo]=ptSpan(p);
    const stopAt=segEnd(p);                          // #5：停点=灵感点本体结束（不含后2s）
    const isThisSpan = playSpanHi!=null && Math.abs(playSpanHi-stopAt)<1e-3;
    if(playing && isThisSpan){ pause(); fillPop(p); return; }          // 正在播这段 → 暂停
    setViewLoop(false);
    loopPtId=null;                                  // 非循环播放：不设 loopPtId
    playSpanHi=stopAt;                              // #5：记停点，tick 播到此处自动暂停
    if(actx && actx.state==='suspended') actx.resume();
    if(isThisSpan && !playing){ play(); }           // 暂停在这段内 → 从暂停处续播(#4)
    else { startOffset=lo; if(!playing){ play(); } else { startSources(lo); } }
    fillPop(p); tick();
  }
  // 循环开关：复用同一前置规则，循环到灵感本体末尾；开启新的会顶掉旧循环。
  function togglePtLoop(p){
    if(loopPtId===p.id){                       // 关闭本点循环
      loopPtId=null;
    }else{                                     // 开启本点循环（顶掉旧的 / 关掉视窗循环）
      const [lo,hi]=ptSpan(p);
      loopPtId=p.id; ptLoopLo=lo; ptLoopHi=hi; playSpanHi=null;   // 循环态覆盖"段尾自动暂停"
      setViewLoop(false);
      if(actx && actx.state==='suspended') actx.resume();
      startOffset=lo; if(!playing){ play(); } else { startSources(lo); }
    }
    renderMarks();                             // 旗子图标/高亮同步
    const cur=findPt(popPtId); if(cur) fillPop(cur);
    tick();
  }
  function playDraft(){
    if(cursorT==null) return;
    if(playing){
      pause();
      updateDraftEditor();
      return;
    }
    if(loopPtId===DRAFT_LOOP_ID){
      play();
      updateDraftEditor();
      return;
    }
    const [lo]=ptSpan({start:cursorT,end:cursorEnd});
    loopPtId=null;
    playSpanHi=cursorEnd;
    startOffset=lo;
    play();
    updateDraftEditor();
  }
  function toggleDraftLoop(){
    if(cursorT==null) return;
    if(loopPtId===DRAFT_LOOP_ID){
      loopPtId=null;
      updateDraftEditor();
      tick();
      return;
    }
    const [lo,hi]=ptSpan({start:cursorT,end:cursorEnd});
    setViewLoop(false);
    loopPtId=DRAFT_LOOP_ID;ptLoopLo=lo;ptLoopHi=hi;playSpanHi=null;startOffset=lo;
    if(!playing) play(); else startSources(lo);
    updateDraftEditor();
    tick();
  }
  els.draftPlayBtn.onclick=playDraft;
  els.draftLoopBtn.onclick=toggleDraftLoop;

  // 事件绑定：整段高光/旗子都可交互（事件委托到 .layers）
  const ptTarget = e => e.target.closest('.pt-flag,.pt-marker');   // 命中段或旗子都算
  els.layers.addEventListener('mouseover',(e)=>{ if(isTouch) return;
    const el=ptTarget(e); if(!el) return;
    openPop(el.dataset.id, el);
  });
  els.layers.addEventListener('mouseout',(e)=>{ if(isTouch) return;
    const el=ptTarget(e); if(!el) return;
    // 移到浮层上不关；否则延迟收起
    popHideTimer=setTimeout(()=>{ if(!pop.matches(':hover')) closePop(); },200);
  });
  // 电脑端：鼠标在浮层上时保持打开，离开浮层再收起
  pop.addEventListener('mouseenter',()=>{ if(!isTouch) clearTimeout(popHideTimer); });
  pop.addEventListener('mouseleave',()=>{ if(!isTouch && document.activeElement!==ppInput) popHideTimer=setTimeout(closePop,200); });
  // 点击段/旗子：钉住选中该灵感点、便签常驻（改动1）。再点同一个=取消钉住。
  // 若当前有"调过长短未确认"的预览段，先走守卫（规则3.1：选中新的灵感点）。
  els.layers.addEventListener('click',(e)=>{
    const el=ptTarget(e); if(!el) return;
    e.stopPropagation();
    const id=el.dataset.id;
    if(pinnedPtId===id){ forceClosePop(); return; }        // 再点已钉住的=取消钉住
    guardAdjusted(()=>{ pinnedPtId=id; openPop(id, el); });
  });
  // 点浮层外空白：收起钉住 + 按规则处理预览段（规则2/3.3）
  document.addEventListener('click',(e)=>{
    if(e.target.closest('.pt-pop')||e.target.closest('.pt-flag,.pt-marker')) return;
    if(pinnedPtId) forceClosePop();                        // 空白处点击=取消钉住
  });

  // 浮层按钮
  ppPlay.addEventListener('click',(e)=>{
    e.stopPropagation();
    const p=findPt(popPtId);if(!p)return;
    if(playing&&loopPtId===p.id){pause();fillPop(p);return;}
    playPtSpan(p);
  });
  ppLoop.addEventListener('click',(e)=>{ e.stopPropagation(); const p=findPt(popPtId); if(p) togglePtLoop(p); });
  ppInput.addEventListener('focus',()=>{
    const p=findPt(popPtId); if(!p)return;
    pinnedPtId=popPtId;popNoteBeforeEdit=p.note||'';clearTimeout(popHideTimer);markActiveFlags();
  });
  ppInput.addEventListener('input',()=>{ const p=findPt(popPtId); if(!p)return; p.note=ppInput.value; save(); renderStructure(); });
  ppInput.addEventListener('blur',()=>{ const p=findPt(popPtId); if(p)p.note=ppInput.value;save();renderStructure();renderMarks(); });
  ppInput.addEventListener('keydown',(e)=>{
    if(e.key==='Enter'){e.preventDefault();ppInput.blur();}
    else if(e.key==='Escape'){
      e.preventDefault();
      const p=findPt(popPtId);if(p){p.note=popNoteBeforeEdit;ppInput.value=popNoteBeforeEdit;save();}
      ppInput.blur();
    }
  });
  ppLen.addEventListener('click',(e)=>{ e.stopPropagation();
    const p=findPt(popPtId); if(!p) return;
    if(loopPtId===p.id) loopPtId=null;
    editingOrig=JSON.parse(JSON.stringify(p));             // 原记录只从当前 UI 暂时拿走，确认前不覆盖本地存储
    editing=true;
    state.points=state.points.filter(x=>x.id!==p.id);
    beginDraft(p.layerId,segStart(p),segEnd(p),p.note||'');
    els.layers.scrollIntoView({behavior:'smooth',block:'center'});
    requestAnimationFrame(()=>{const sel=els.layers.querySelector('.lane[data-layer="'+p.layerId+'"] .seg-sel');if(sel){sel.classList.remove('editing');void sel.offsetWidth;sel.classList.add('editing');}});
  });
  ppDel.addEventListener('click',(e)=>{ e.stopPropagation();
    const p=findPt(popPtId); if(!p) return;
    if(loopPtId===p.id) loopPtId=null;
    state.points=state.points.filter(x=>x.id!==p.id);
    forceClosePop();
    save();renderStructure();renderMarks();updateSteps();tick();
  });
  // 滚动/缩放时浮层位置会失准（钉住态跟随重定位，非钉住态收起）
  window.addEventListener('scroll',()=>{ if(popPtId==null) return; if(pinnedPtId){ const el=els.layers.querySelector('.pt-flag[data-id="'+pinnedPtId+'"]'); if(el) placePop(el); } else closePop(); }, true);
  window.addEventListener('resize',()=>{ if(popPtId!=null) forceClosePop(); });

  // ---------- 缩放：四轨同步 + 动画补间（丝滑）+ 进度条视窗指示 ----------
  const ZOOM_MIN=4, ZOOM_MAX=8;
  let zoomRaf=null;
  function paintTimeRuler(){
    if(!state.duration||previewMode){els.timeRuler.innerHTML='';return;}
    const len=viewLen(), target=len/7;
    const steps=[1,2,5,10,15,30,60,120];
    const step=steps.find(x=>x>=target)||steps[steps.length-1];
    let html='';
    for(let t=Math.ceil(view.start/step)*step;t<=view.end+1e-6;t+=step){
      const x=pct(t);
      html+='<span class="time-tick" style="left:'+x+'%"></span>';
      if(t>1e-6) html+='<span class="time-tick-label" style="left:'+x+'%">'+fmt(t).replace(/\.0$/,'')+'</span>';
    }
    els.timeRuler.innerHTML=html;
  }

  // 横向平移滑块：拖 thumb（或点轨道空白）平移视窗，看放大片段的前后内容
  (function initPan(){

        if(ev.pointerId!==pointerId)return;

        panTo(leftPx/rect.width);
      };

        if(els.pan.hasPointerCapture&&els.pan.hasPointerCapture(pointerId))els.pan.releasePointerCapture(pointerId);

      els.pan.addEventListener('pointercancel',up);

    els.layers.addEventListener('wheel',(e)=>{

      const slotEnds=[];
      points.forEach(p=>{
        const s=segStart(p),e=segEnd(p),trueH=Math.max(2,vYOf(e)-vYOf(s));
        let slot=slotEnds.findIndex(end=>end<=s);if(slot<0){slot=slotEnds.length;slotEnds.push(e);}else slotEnds[slot]=e;
        const card=document.createElement('div');card.className='vmap-point'+(loopPtId===p.id||vSelectedId===p.id?' active':'');
        card.style.top=vYOf(s)+'px';card.style.height=Math.max(28,trueH)+'px';card.style.left=(5+slot*12)+'px';
        card.style.background=hexA(L.color,.42);card.style.borderColor=L.color;card.dataset.id=p.id;
        const has=p.note&&p.note.trim();
        card.innerHTML='<span class="vmap-duration" style="height:'+trueH+'px;background:'+L.color+'"></span><span class="vmap-point-text'+(has?'':' empty')+'">'+escapeHtml(has?p.note:'等待你的灵感记录')+'</span>';
        card.title=fmt(s)+'–'+fmt(e)+' · '+(e-s).toFixed(1)+'s';
        card.onclick=(ev)=>{ev.stopPropagation();vSelectedId=p.id;vBlankTime=null;vAutoPointIds=[];vAutoSuppressedKey='';updateVMapSelection();renderVInspector();playPtSpan(p);};
        lane.appendChild(card);
      });
      lane.onclick=(ev)=>{if(ev.target.closest('.vmap-point'))return;ev.stopPropagation();const r=lane.getBoundingClientRect(),y=Math.max(VHEAD,Math.min(vMapH,ev.clientY-r.top));vBlankTime=(y-VHEAD)/(vMapH-VHEAD)*state.duration;vSelectedId=null;vAutoSuppressedKey=vAutoPointIds.join(',');vAutoPointIds=[];loopPtId=null;playSpanHi=null;seek(vBlankTime);updateVMapSelection();renderVInspector();};
      map.appendChild(lane);
    });
    if(!state.points.length){const empty=document.createElement('div');empty.className='vmap-empty';empty.textContent='还没有灵感记录';map.appendChild(empty);}
    const vph=document.createElement('div');vph.className='vplayhead';vph.id='vplayhead';map.appendChild(vph);
    body.appendChild(map);
    const inspector=document.createElement('aside');inspector.className='vinspector';body.appendChild(inspector);
    if(vSelectedId&&!findPt(vSelectedId))vSelectedId=null;
    renderVInspector();paintVPlayhead();
    els.vview.onclick=(ev)=>{
      if(ev.target.closest('.vmap-point,.vinspector,.vmap-lane'))return;
      vAutoSuppressedKey=overviewPointIdsAt(now()).join(',');vAutoPointIds=[];vSelectedId=null;vBlankTime=null;updateVMapSelection();renderVInspector();
    };
  }
  function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  // 纵向总览播放头横跨四条轨道。
  function paintVPlayhead(){
    if(!previewMode) return;
    const y=vYOf(Math.max(0,Math.min(state.duration,now())));
    const vph=els.vviewBody.querySelector('#vplayhead');
    if(vph){ vph.style.display='block'; vph.style.top=y+'px'; vph.style.left='0'; vph.style.width='100%'; }
  }
  // 切换视图切换器
  els.tabEdit.onclick=()=>{ if(!ready||!previewMode)return; setPreviewMode(false); };
  els.tabPreview.onclick=()=>{ if(!ready||previewMode)return; setPreviewMode(true); };
  window.addEventListener('resize',()=>{ if(previewMode) paintVPlayhead(); });
  // 进入/退出全曲总览。总览允许改文字，位置和长度仍需回创作视图编辑。
  function setPreviewMode(on,persist=true){
    if(on&&markArmed) setMarkArmed(false);
    if(on&&loopView) setViewLoop(false);
    previewMode=on;
    if(persist) sessionStorage.setItem('choreo_view_'+songId,on?'overview':'edit');
    els.tabEdit.classList.toggle('on', !on);
    els.tabPreview.classList.toggle('on', on);
    els.vview.classList.toggle('on', on);
    // 全局预览下删除"八拍显示"键、底部"我的灵感点"、以及打点提示行/确定标记行（只保留在创作视图）
    els.beatBtn.style.display = on ? 'none' : '';
    els.zoomGroup.style.display = on ? 'none' : '';
    els.loopBtn.style.display = on ? 'none' : '';
    els.timeRuler.style.display = on ? 'none' : '';
    els.progressA.classList.toggle('on',!on);
    els.progressB.classList.toggle('on',!on);
    if(els.structureWrap) els.structureWrap.style.display = on ? 'none' : '';
    if(els.modebar) els.modebar.style.display = on ? 'none' : '';
    if(els.addRow) els.addRow.style.display = on ? 'none' : '';
    if(on){
      forceClosePop();                       // 收起浮层（预览选段状态保留，返回时原样恢复，无损）
      els.layers.style.display='none';
      els.pan.style.display='none';
      renderVView();
    }else{
      els.layers.style.display='';
      els.pan.style.removeProperty('display');       // 清掉预览模式留下的内联隐藏，否则 .pan.on 也无法显示
      paintViewBox();                                // 恢复当前倍数对应的滑块位置和宽度
      paintPlayhead(); paintBeats(); paintLoopEdges();
    }
    refreshPtBtn();                          // 预览模式为只读：ptBtn 灰掉
  }

  // 八拍标尺：把 beatData 的拍点按当前视窗[view]换算到像素、画竖线+每小节第1拍标1-8。可选叠加、随缩放/平移重画。
  function paintBeats(){
    let ov=els.layers.querySelector('#beatOverlay');
    if(!ov){ ov=document.createElement('div'); ov.id='beatOverlay'; ov.className='beat-overlay'; els.layers.appendChild(ov); }
    ov.classList.toggle('on', showBeats && !!beatData);
    if(!showBeats || !beatData){ ov.innerHTML=''; return; }
    const lanes=els.layers.querySelectorAll('.lane'); if(!lanes.length){ ov.innerHTML=''; return; }
    const contRect=els.layers.getBoundingClientRect();
    const first=lanes[0].getBoundingClientRect(), last=lanes[lanes.length-1].getBoundingClientRect();
    const laneLeft=first.left-contRect.left, laneW=first.width;
    ov.style.left=laneLeft+'px'; ov.style.top=(first.top-contRect.top)+'px';
    ov.style.width=laneW+'px'; ov.style.height=(last.bottom-first.top)+'px';
    // 只画落在当前视窗内的拍，避免放大时画上千条
    const vs=view.start, ve=(view.end>view.start)?view.end:state.duration, vlen=ve-vs;
    let html='';
    // 用 beats[] + nums[]（每拍的 1-8 编号）逐拍画；拍子从歌曲开头就存在，编号只是相位
    const bs=beatData.beats||[], ns=beatData.nums||[];
    for(let i=0;i<bs.length;i++){
      const t=bs[i]; if(t<vs||t>ve) continue;
      const x=((t-vs)/vlen)*laneW;
      const n=ns[i]||(((i)%8)+1);
      const isDown=(n===1);   // 第1拍：加粗竖线 + 琥珀数字
      html+=`<div class="beat-line${isDown?' b1':''}" style="left:${x}px"></div>`;
      html+=`<div class="beat-num${isDown?' n1':''}" style="left:${x}px">${n}</div>`;
    }
    ov.innerHTML=html;
  }
  function tick(){
    let t=now();
    // 灵感点循环：播到区间尾（或跑到区间外）自动跳回区间头。优先于普通收尾。
    if(loopPtId && playing && (t>=ptLoopHi-0.02 || t<ptLoopLo-0.02)){
      seek(ptLoopLo); return;
    }
    // #5：非循环播放某灵感段，播到段尾自动暂停（停在段尾，主播放键可从此处续播）
    if(playSpanHi!=null && !loopPtId && playing && t>=playSpanHi-0.02){
      startOffset=playSpanHi; stopSources();guidePlaybackStop();playing=false; els.playBtn.textContent='▶'; cancelAnimationFrame(raf);
      const cur=findPt(popPtId); if(cur && pop.style.display!=='none') fillPop(cur);   // 刷新浮层播放键为▶
      playSpanHi=null; tick(); return;
    }
    // 变速路径没有 onended，播到结尾在这里收尾（1.0× 由 source.onended 处理）
    if(playing && rate!==1 && !loopView && !loopPtId && t>=state.duration-0.05){
      guidePlaybackStop();playing=false;els.playBtn.textContent='▶';cancelAnimationFrame(raf);stopSources();startOffset=0;tick();return;
    }
    // 循环视窗：播到视窗尾（或跑到视窗外）自动跳回视窗头
    if(loopView && playing && (t>=view.end-0.02 || t<view.start-0.02)){
      seek(view.start); return;
    }
    followPlayhead(t);
    checkPlaybackGuide();
    els.cur.textContent=fmt(t);
    const gp = (t-rangeLo())/rangeLen();               // 进度条按"参照范围"算：循环时=视窗，否则=整首
    const gpc = Math.max(0,Math.min(1,gp));
    // 循环状态可能由灵感点浮层切换；逐帧同步显隐，避免旧的 AB/视窗高亮残留。
    els.progressView.classList.toggle('on', zoom>1.001 && !loopView && !loopPtId);
    paintPlayhead();
    if(previewMode){paintVPlayhead();updateVAutoReveal(t);updateVInspectorPlayback();}
    els.progressFill.style.width=(gpc*100)+'%'; els.progressKnob.style.left=(gpc*100)+'%';
    if(cursorT!=null) updateDraftEditor();
  }
  function loop(){ tick(); raf=requestAnimationFrame(loop); }

  // ---------- 独立进度条：点击 + 拖动 seek（基于整段，不受缩放影响）----------
  // 拖动时只移动视觉、不反复重启音源；松手才真正 seek，避免卡顿
  let dragging=false, wasPlaying=false, dragT=0;
  function progressPct(clientX){ const r=els.progress.getBoundingClientRect(); return Math.max(0,Math.min(1,(clientX-r.left)/r.width)); }
  // p 是"参照范围"内的比例 [0,1]；换算成真实秒数 = rangeLo + p*rangeLen（循环时=视窗内，否则=整首）
  function paintProgress(p){ els.progressFill.style.width=(p*100)+'%'; els.progressKnob.style.left=(p*100)+'%'; paintPlayhead(); els.cur.textContent=fmt(rangeLo()+p*rangeLen()); }
  const dragStart=(clientX)=>{ if(!ready)return; dragging=true; wasPlaying=playing; if(playing){ pause(); } dragT=progressPct(clientX); paintProgress(dragT); };
  const dragMove =(clientX)=>{ if(!dragging)return; dragT=progressPct(clientX); paintProgress(dragT); };
  const dragEnd  =()=>{
    if(!dragging)return;
    dragging=false;
    startOffset=rangeLo()+dragT*rangeLen();
    // 顶部进度条代表全曲（或灵感循环范围）导航；跳转后让放大波形同步显示并居中该位置。
    // AB 循环时当前视窗本身就是循环边界，不能因居中而改变 A/B。
    if(zoom>1.001 && !loopView) centerViewAt(startOffset);
    if(wasPlaying){ play(); } else { tick(); }
  };
  // 鼠标（桌面）
  els.progress.addEventListener('mousedown',e=>{ dragStart(e.clientX); });
  window.addEventListener('mousemove',e=>{ dragMove(e.clientX); });
  window.addEventListener('mouseup',dragEnd);
  // 触摸（手机）：按住圆球/进度条任意处都能拖动；拖动中阻止页面滚动
  els.progress.addEventListener('touchstart',e=>{ if(!ready)return; if(e.cancelable)e.preventDefault(); dragStart(e.touches[0].clientX); },{passive:false});
  window.addEventListener('touchmove',e=>{ if(!dragging)return; if(e.cancelable)e.preventDefault(); dragMove(e.touches[0].clientX); },{passive:false});
  window.addEventListener('touchend',dragEnd);

  els.clearBtn.onclick=()=>{ if(!state.points.length && cursorT==null){return;} if(!confirm('清空所有灵感点？'))return; state.points=[]; cursorT=null; cursorEnd=null; editing=false; editingOrig=null; editingNote=''; segAdjusted=false; markArmed=false; loopPtId=null; forceClosePop(); setDraftFocus(false); save();buildLanes();renderMarks();renderStructure();renderModebar();refreshPtBtn();updateSteps(); };
  // 帮助「?」：点击/tap 切换弹出（手机没有 hover，必须支持点击），点其他地方收起
  (function initHelp(){
    const hb=$('#helpBtn'); if(!hb) return;
    const pop=hb.querySelector('.help-pop');
    hb.addEventListener('click',(e)=>{
      if(pop && pop.contains(e.target)) return;   // 点在气泡文本内不切换（只当阅读）
      e.stopPropagation(); hb.classList.toggle('open');
    });
    document.addEventListener('click',(e)=>{ if(!hb.contains(e.target)) hb.classList.remove('open'); });
  })();
  function updateSteps(){ /* 步骤已改为非线性说明，不再高亮进度 */ }
  // 空格播放/暂停；草稿中控制草稿试听。Esc 退出一次性标记或取消草稿。
  document.addEventListener('keydown',(e)=>{
    if(e.target.closest('input,textarea,select')) return;
    if(e.code==='Space'){e.preventDefault();if(!ready)return;cursorT!=null?playDraft():(playing?pause():play());return;}
    if(e.key==='Escape'){
      if(cursorT!=null){cancelDraft();}
      else if(markArmed){setMarkArmed(false);}
    }
  });
  window.addEventListener('resize',()=>{ if(ready){buildLanes();renderMarks();} });

  init();
})();
</script>
</body>
